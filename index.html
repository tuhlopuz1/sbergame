<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F2F3F7">
<meta name="color-scheme" content="light">
<title>Кляксик против Лиса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Стиль по мотивам дизайн-системы СберKids «1dali»:
   белая «комната» + кислотные спреи, дудлы и блобы с глазками.
   ============================================================ */
:root{
  --bg:#F2F3F7;--card:#fff;--ink:#111216;--ink2:#2B2D35;--muted:#8B8FA0;--line:#E6E8EF;--soft:#EEF0F5;
  --lime:#C6F432;--green:#1FD16C;--cyan:#2EC5FF;--blue:#1A9BFF;--pink:#FF5CE6;--purple:#A77BFF;--yellow:#FFDD2E;--orange:#FF8A1F;--red:#FF3D6E;--fox:#FF7A1A;
  --m:#C6F432;
  --grad:linear-gradient(90deg,#27C4FF 0%,#35DE7B 55%,#C8F535 100%);
  --shadow:0 10px 30px rgba(24,26,40,.08),0 2px 6px rgba(24,26,40,.05);
  --font:"Onest","SB Sans Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Comic Sans MS",cursive;
  --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.23,1,.32,1);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--bg)}
body{font-family:var(--font);color:var(--ink);background:var(--bg);height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}
#app{height:100vh;height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
@media (min-width:560px){html,body{background:#E4E6EE}}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
svg{display:block;overflow:visible}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:screenIn .5s var(--out) both}
@keyframes screenIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

/* ---------- spray-фон ---------- */
.blobs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blobs i{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;animation:blobDrift 12s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:260px;height:260px;background:var(--lime);top:-60px;right:-70px}
.blobs i:nth-child(2){width:220px;height:220px;background:var(--pink);top:34%;left:-110px;animation-delay:-4s;opacity:.38}
.blobs i:nth-child(3){width:240px;height:240px;background:var(--cyan);bottom:-90px;right:-40px;animation-delay:-8s;opacity:.42}
@keyframes blobDrift{from{transform:translate(0,0) scale(1)}to{transform:translate(24px,30px) scale(1.12)}}

/* ---------- кнопки ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:14px 20px;border-radius:20px;
  background:var(--grad);color:var(--ink);font-weight:800;font-size:18px;letter-spacing:-.01em;width:100%;
  box-shadow:0 8px 22px rgba(46,197,255,.28),inset 0 -3px 0 rgba(0,0,0,.08);transition:transform .14s var(--out),filter .2s}
.btn:active{transform:scale(.96)}
.btn.dark{background:var(--ink);color:#fff;box-shadow:0 8px 20px rgba(17,18,22,.2)}
.btn.soft{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.ibtn{width:46px;height:46px;border-radius:15px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);flex:none;transition:transform .14s var(--out);color:var(--ink)}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:22px;height:22px}
.sound-btn .wv{opacity:0;transition:opacity .2s}
.sound-btn.on .wv{opacity:1;animation:wv 1.2s ease-in-out infinite}
.sound-btn.on .wv2{animation-delay:.2s}
.sound-btn.on .mute{opacity:0}
@keyframes wv{0%,100%{opacity:.35}50%{opacity:1}}
@media (hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.05)}.ibtn:hover{transform:translateY(-1px)}}

/* ---------- дудлы ---------- */
.draw path,.draw circle,path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawIn .9s var(--out) forwards;animation-delay:var(--d,0s)}
@keyframes drawIn{to{stroke-dashoffset:0}}
.wiggle{animation:wig 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
.twinkle{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1);opacity:1}}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}

/* ---------- Кляксик ---------- */
.klx .k-body{transform-box:fill-box;transform-origin:50% 100%;animation:kBob 2.2s ease-in-out infinite}
@keyframes kBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(.98,1.03)}}
.klx .k-eyes{transform-box:fill-box;transform-origin:center;animation:kBlink 4.2s infinite}
@keyframes kBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.klx .mo{opacity:0;transition:opacity .15s}
.klx .mo-smile{opacity:1}
[data-mood=happy] .klx .mo-smile,[data-mood=oops] .klx .mo-smile,[data-mood=sad] .klx .mo-smile{opacity:0}
[data-mood=happy] .klx .mo-happy{opacity:1}
[data-mood=oops] .klx .mo-oops{opacity:1}
[data-mood=sad] .klx .mo-sad{opacity:1}
[data-mood=happy] .klx .k-body{animation:kJump .5s var(--out) 3}
@keyframes kJump{0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.1,.88)}60%{transform:translateY(-16px) scale(.94,1.08)}}
[data-mood=oops] .klx .k-body{animation:kShake .4s linear 2}
@keyframes kShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
[data-mood=sad] .klx .k-pupils{transform:translateY(5px)}
.klx .k-drip{animation:kDrip 3.4s ease-in infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes kDrip{0%,30%{transform:scaleY(0);opacity:1}75%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1) translateY(10px);opacity:0}}
.spray-can{transform-box:fill-box;transform-origin:50% 100%;animation:canShake 1.4s ease-in-out infinite}
@keyframes canShake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(6deg)}}

/* ---------- Лис ---------- */
.fox .f-tail{transform-box:fill-box;transform-origin:0% 90%;animation:swish 1.5s ease-in-out infinite}
@keyframes swish{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.fox .f-lids{transition:transform .25s var(--out),opacity .2s}
.fox.caught .f-lids{transform:translateY(-12px);opacity:0}
.fox .f-mask{transform-box:fill-box;transform-origin:50% 50%}
.fox.cracking .f-mask{animation:jit .1s linear infinite}
@keyframes jit{0%,100%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}
.fox.unmasked .f-mask{animation:maskDrop .8s cubic-bezier(.55,0,.85,.4) forwards}
@keyframes maskDrop{to{transform:translate(40px,260px) rotate(80deg);opacity:0}}
.fox .f-leg{transform-box:fill-box;transform-origin:50% 0}
.fox.running .l1{animation:leg .15s linear infinite}
.fox.running .l2{animation:leg .15s linear infinite reverse}
@keyframes leg{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(35deg)}}
.fox .f-bang{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.fox.caught .f-bang{opacity:1;animation:pop .45s var(--spring) both}

/* ---------- Intro ---------- */
.intro{padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 16px)}
.intro>*{position:relative;z-index:1}
.row{display:flex;justify-content:space-between;align-items:center}
.hero{flex:1;min-height:0;width:100%}
.ttl{font-weight:900;font-size:clamp(34px,10vw,46px);line-height:.98;letter-spacing:-.03em;margin:4px 0 0;position:relative}
.ttl .u{position:relative;display:inline-block;z-index:0}
.ttl .u svg{position:absolute;left:-6%;bottom:-6px;width:112%;height:24px;z-index:-1}
.lead{font-weight:600;font-size:16.5px;line-height:1.35;color:var(--ink2);margin:12px 0 14px;max-width:360px}
.hand{font-family:var(--hand);font-weight:700;font-size:24px;line-height:1;color:var(--ink)}
.pick{display:flex;align-items:center;gap:6px;background:#fff;border-radius:20px;padding:8px 10px 8px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.pick .hand{font-size:21px;flex:1}
.sw{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;transition:transform .2s var(--spring),background .2s}
.sw svg{width:40px;height:40px}
.sw.on{background:var(--soft);transform:scale(1.12)}
.sw:active{transform:scale(.9)}
.best{text-align:center;font-weight:700;font-size:14px;color:var(--muted);margin-top:10px}

/* ---------- HUD / поле ---------- */
.game{padding-top:var(--safe-t)}
.hud{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;position:relative;z-index:8}
.waves{flex:1;display:flex;gap:6px}
.waves i{flex:1;height:8px;border-radius:9px;background:#DCDFE8;overflow:hidden;position:relative}
.waves i.boss{flex:.6;background:#F3D9EF}
.waves i b{position:absolute;inset:0;width:0;background:var(--green);border-radius:9px;transition:width .5s var(--out)}
.waves i.boss b{background:var(--pink)}
.score{min-width:64px;height:46px;border-radius:15px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 12px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.score svg{width:18px;height:18px}
.score.bump{animation:bump .4s var(--spring)}
@keyframes bump{40%{transform:scale(1.18)}}

.field{position:relative;flex:1;min-height:0;overflow:hidden;z-index:2}
.field .dim{position:absolute;inset:0;background:rgba(17,18,22,.32);opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}
.field .dim.show{opacity:1}
.combo{position:absolute;right:14px;top:6px;z-index:6;pointer-events:none;opacity:0;transform:scale(.4) rotate(-12deg);transition:opacity .2s,transform .35s var(--spring)}
.combo.show{opacity:1;transform:rotate(-8deg)}
.combo svg{width:100px;height:56px}

.msg{position:absolute;left:0;top:0;width:min(330px,calc(100% - 24px));background:#fff;border-radius:22px;padding:11px 13px 12px;box-shadow:var(--shadow);cursor:pointer;will-change:transform;z-index:3;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.msg-in{transition:transform .14s var(--out)}
.msg:active .msg-in{transform:scale(.97)}
.msg-top{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.msg-av{width:38px;height:38px;flex:none}
.msg-av svg{width:38px;height:38px}
.msg-av.flip svg{animation:flip .55s var(--spring)}
@keyframes flip{from{transform:rotateY(90deg) scale(.5)}to{transform:none}}
.msg-meta{display:flex;flex-direction:column;min-width:0}
.msg-meta b{font-weight:800;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-meta b s{color:var(--muted);text-decoration-thickness:2.5px;text-decoration-color:var(--red);margin-right:5px}
.msg-meta b em{font-style:normal;color:var(--fox)}
.msg-meta span{font-weight:600;font-size:12.5px;color:var(--muted)}
.msg-meta span.warn{color:var(--orange)}
.msg-text{font-weight:700;font-size:17px;line-height:1.32;color:var(--ink);position:relative;z-index:1}
.msg .key{border-radius:6px;transition:background .25s}
.msg.hit .key{background:linear-gradient(transparent 12%,var(--m) 12%,var(--m) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.msg .splat{position:absolute;width:150px;height:150px;left:50%;top:50%;margin:-75px 0 0 -75px;pointer-events:none;mix-blend-mode:multiply;z-index:2}
.sp{transform-box:fill-box;transform-origin:center;animation:splat .32s var(--out) both}
@keyframes splat{from{transform:scale(.1)}to{transform:scale(1)}}
.drip{stroke-dasharray:1;stroke-dashoffset:1;animation:drawIn 1.2s ease-in .2s forwards}
.tag{position:absolute;right:-6px;top:-14px;background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:6px 10px;border-radius:12px;transform:rotate(4deg);z-index:4;animation:tagIn .45s var(--spring) both;white-space:nowrap}
@keyframes tagIn{from{transform:rotate(-14deg) scale(0)}to{transform:rotate(4deg) scale(1)}}
.msg.gone{transition:transform .5s cubic-bezier(.55,0,.85,.4),opacity .5s;opacity:0}
.msg.oops{animation:msgShake .4s}
@keyframes msgShake{0%,100%{margin-left:0}25%{margin-left:-6px}75%{margin-left:6px}}
.msg.spot{z-index:7;animation:spot 1.1s ease-in-out infinite}
@keyframes spot{0%,100%{box-shadow:0 0 0 4px var(--m),0 0 0 9px rgba(255,255,255,.7),var(--shadow)}50%{box-shadow:0 0 0 7px var(--m),0 0 0 14px rgba(255,255,255,.5),var(--shadow)}}
.msg.delivered{transition:transform .45s var(--out),opacity .45s;opacity:0}

/* dock */
.dock{position:relative;z-index:6;margin:0 12px calc(var(--safe-b) + 10px);background:#fff;border-radius:26px;box-shadow:0 -6px 24px rgba(24,26,40,.06),var(--shadow);display:flex;align-items:center;gap:8px;padding:8px 12px 8px 6px;min-height:76px}
.dock-m{width:64px;height:64px;flex:none;margin-top:-26px}
.dock-m svg{width:100%;height:100%}
.dock-say{flex:1;font-weight:700;font-size:14px;line-height:1.25;min-width:0}
.dock-say .in{display:block;animation:sayIn .3s var(--out) both}
@keyframes sayIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-size:17px;padding:6px 9px;border-radius:14px;background:var(--soft);font-variant-numeric:tabular-nums}
.stat svg{width:22px;height:22px}
.stat.pig svg{width:38px;height:30px}
.stat.wob{animation:wob .5s}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}

/* tip */
.tip{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 96px);z-index:9;background:#fff;border-radius:24px;padding:14px 14px 14px 10px;box-shadow:0 16px 40px rgba(17,18,22,.22);display:flex;gap:8px;align-items:flex-start;transform:translateY(30px) scale(.95);opacity:0;pointer-events:none;transition:transform .4s var(--spring),opacity .25s}
.tip.show{transform:none;opacity:1;pointer-events:auto}
.tip .tm{width:58px;height:58px;flex:none}
.tip h4{font-weight:900;font-size:18px;line-height:1.15;margin:6px 0 3px}
.tip p{font-weight:600;font-size:15px;line-height:1.35;color:var(--ink2)}
.tip .btn{min-height:46px;font-size:16px;margin-top:10px;border-radius:15px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--ink);color:#fff;font-weight:800;font-size:13.5px;padding:5px 10px;border-radius:11px}
.chip.m{background:var(--m);color:var(--ink)}

/* модалка */
.modal{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(var(--safe-b) + 12px);background:rgba(17,18,22,.38);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.show{opacity:1;pointer-events:auto}
.mcard{width:100%;background:#fff;border-radius:30px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);transform:translateY(40px);transition:transform .45s var(--spring);position:relative;max-height:92%;overflow-y:auto}
.modal.show .mcard{transform:none}
.mcard .mh{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:relative;z-index:1}
.mcard .mh .mm{width:70px;height:70px;flex:none}
.mcard h3{font-weight:900;font-size:23px;line-height:1.1;letter-spacing:-.02em}
.mcard p{font-weight:600;font-size:16px;line-height:1.4;color:var(--ink2);margin:10px 0 14px}
.quote{background:var(--soft);border-radius:18px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start}
.quote svg{width:34px;height:34px;flex:none}
.quote b{display:block;font-size:13.5px;font-weight:800;color:var(--muted)}
.quote div{font-weight:700;font-size:15.5px;line-height:1.35}
.quote .key{background:linear-gradient(transparent 12%,var(--m) 12%,var(--m) 92%,transparent 92%)}
.mcard .btn+.btn{margin-top:10px}
.mcard .deco{position:absolute;right:0;top:0;width:110px;height:110px;pointer-events:none}

/* интро волны */
.wave-in{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(242,243,247,.95);opacity:0;pointer-events:none;transition:opacity .3s}
.wave-in.show{opacity:1;pointer-events:auto}
.wave-in .big{font-weight:900;font-size:60px;line-height:.95;letter-spacing:-.04em;position:relative;z-index:0}
.wave-in .big svg{position:absolute;left:-8%;bottom:-12px;width:116%;height:30px;z-index:-1}
.wave-in .hand{font-size:28px;margin:18px 0 12px}
.wave-in .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px;max-width:340px}
.wave-in .chips .chip{font-size:15px;padding:8px 12px;border-radius:14px;animation:pop .45s var(--spring) both;animation-delay:calc(.3s + var(--i)*.1s)}
.wave-in .btn{max-width:320px}
.wave-in .wk{width:120px;height:120px;margin-bottom:6px}
.count{position:absolute;inset:0;z-index:16;display:grid;place-items:center;pointer-events:none}
.count span{font-weight:900;font-size:130px;line-height:1;animation:cnt .7s var(--out) both;position:relative;z-index:0}
.count svg{position:absolute;width:220px;height:220px;left:50%;top:50%;margin:-110px 0 0 -110px;z-index:-1}
@keyframes cnt{0%{transform:scale(2.2);opacity:0}30%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.7);opacity:0}}

/* ---------- Босс ---------- */
.bossv{position:absolute;left:0;right:0;bottom:0;top:calc(var(--safe-t) + 62px);z-index:7;display:flex;flex-direction:column;padding:0 14px calc(var(--safe-b) + 12px);background:var(--bg);animation:screenIn .5s var(--out) both}
.bossv .arena{position:relative;height:clamp(150px,27vh,220px);flex:none;display:flex;flex-direction:column;align-items:center}
.bossv .bfox{height:calc(100% - 34px);aspect-ratio:160/170;transition:transform .9s cubic-bezier(.55,0,.75,.2)}
.bossv .bfox.hit{animation:hit .35s}
@keyframes hit{0%{transform:translateX(0);filter:brightness(1)}20%{transform:translateX(-10px) rotate(-6deg);filter:brightness(2.2)}50%{transform:translateX(8px) rotate(4deg)}100%{transform:none;filter:brightness(1)}}
.bossv .bfox.gone{transform:translate(70vw,-50vh) rotate(540deg) scale(.2)}
.bossv .bfox svg{width:100%;height:100%}
.hp{display:flex;gap:5px;align-items:center;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:var(--shadow);font-weight:800;font-size:13px}
.hp i{width:30px;height:10px;border-radius:6px;background:var(--pink);transition:transform .3s var(--spring),background .3s}
.hp i.off{background:var(--line);transform:scaleY(.6)}
.bossv .bchat{position:relative;flex:1;min-height:0;background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:12px 14px;overflow-y:auto;overscroll-behavior:contain;margin-top:8px}
.bossv .bchat .msg-top{margin-bottom:10px}
.bossv .btext{font-weight:700;font-size:18.5px;line-height:1.55}
.ch{border-radius:7px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .25s,color .25s}
.ch.lnk{color:var(--blue);text-decoration:underline;word-break:break-all}
.bsplat{position:absolute;width:84px;height:84px;pointer-events:none;mix-blend-mode:multiply;opacity:.9;z-index:0}
.btext{position:relative;z-index:1}
.ch.hitc{background:linear-gradient(transparent 8%,var(--m) 8%,var(--m) 94%,transparent 94%)}
.ch.miss{color:#B9BCC8}
.ch.hint{animation:hintG 1s ease-in-out infinite}
@keyframes hintG{0%,100%{background:rgba(255,221,46,.35)}50%{background:rgba(255,221,46,.9)}}
.bossv .bbar{display:flex;gap:10px;align-items:center;margin-top:10px}
.bossv .bbar .bm{width:58px;height:58px;flex:none}
.bossv .bbar .dock-say{background:#fff;border-radius:18px;padding:9px 12px;box-shadow:var(--shadow);min-height:52px;display:flex;align-items:center}
.bossv .bbar .ibtn svg{width:26px;height:26px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:20px;background:var(--soft);font-weight:700;font-size:16px;line-height:1.3;transition:transform .12s var(--out),opacity .2s;animation:pop .4s var(--spring) both;animation-delay:calc(var(--i)*.07s)}
.opt:active{transform:scale(.97)}
.opt .oi{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#fff}
.opt.no{opacity:.4;text-decoration:line-through;pointer-events:none}
.victory{position:absolute;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none}
.victory .vt{font-weight:900;font-size:58px;letter-spacing:-.04em;transform:rotate(-6deg);animation:vIn .6s var(--spring) both;position:relative;z-index:0}
.victory svg{position:absolute;left:-12%;top:-30%;width:124%;height:160%;z-index:-1}
@keyframes vIn{from{transform:rotate(-30deg) scale(0)}to{transform:rotate(-6deg) scale(1)}}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.pts{position:absolute;font-weight:900;font-size:22px;color:var(--ink);text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;animation:ptsUp .9s var(--out) forwards;white-space:nowrap}
@keyframes ptsUp{0%{opacity:0;transform:translate(-50%,0) scale(.5)}25%{opacity:1;transform:translate(-50%,-14px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-60px)}}
.runner{position:absolute;width:56px;height:56px;transition:transform 1s cubic-bezier(.5,0,.8,.3)}
.runner svg{width:100%;height:100%}
.runner .rc{position:absolute;right:-8px;top:-8px;width:26px;height:26px}
.flycoin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;transition:transform .55s cubic-bezier(.3,.7,.4,1)}
.flycoin svg{width:28px;height:28px;animation:coinSpin .5s linear infinite}
@keyframes coinSpin{50%{transform:scaleX(.15)}}
.heart{position:absolute;width:28px;height:28px;animation:heartUp 1.2s var(--out) forwards}
.heart svg{width:28px;height:28px}
@keyframes heartUp{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:translateY(-18px) scale(1.15)}100%{opacity:0;transform:translateY(-70px) scale(.8)}}
.conf{position:absolute;top:-30px;width:26px;height:26px;animation:fall var(--d) cubic-bezier(.25,.6,.45,1) forwards;animation-delay:var(--dl)}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

/* ---------- Результат ---------- */
.result{overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 20px)}
.result>*{position:relative;z-index:1}
.r-hero{position:relative;height:200px;margin:4px 0}
.r-hero>svg{width:100%;height:100%}
.r-ttl{font-weight:900;font-size:38px;line-height:1;letter-spacing:-.03em}
.r-sub{font-weight:600;color:var(--ink2);margin:10px 0 16px;line-height:1.35;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.sc{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:pop .5s var(--spring) both;animation-delay:calc(.5s + var(--i)*.08s)}
.sc .v{font-weight:900;font-size:30px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.sc .v small{font-size:18px;color:var(--muted);font-weight:800}
.sc .v svg{width:30px;height:30px}
.sc .l{font-weight:600;font-size:13.5px;color:var(--muted);margin-top:2px;position:relative;z-index:1}
.sc .bl{position:absolute;right:-18px;bottom:-18px;width:64px;height:64px;border-radius:50%;opacity:.5;filter:blur(2px)}
.h2{font-weight:900;font-size:22px;letter-spacing:-.02em;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.tc{background:#fff;border-radius:20px;padding:14px 6px 10px;text-align:center;box-shadow:var(--shadow);position:relative;animation:pop .45s var(--spring) both;animation-delay:calc(.8s + var(--i)*.05s)}
.tc .ci{font-size:30px;line-height:1}
.tc .ct{font-weight:800;font-size:12.5px;line-height:1.15;margin-top:5px}
.tc .st{position:absolute;top:-8px;right:-4px;font-size:11px;font-weight:800;padding:3px 7px;border-radius:9px;background:var(--m);color:var(--ink);transform:rotate(6deg)}
.tc.miss .st{background:var(--yellow)}
.tc.none{opacity:.45}
.tc.none .st{background:var(--line)}
.rules{background:var(--ink);color:#fff;border-radius:26px;padding:16px;margin-bottom:20px;display:flex;flex-direction:column;gap:12px}
.rule{display:flex;gap:12px;align-items:center;font-weight:700;font-size:15.5px;line-height:1.3}
.rule .rn{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--ink);font-weight:900;background:var(--c)}
.btns{display:flex;flex-direction:column;gap:10px}

@media (max-height:660px){
  .msg-text{font-size:15.5px}
  .bossv .btext{font-size:16.5px}
  .lead{font-size:15px;margin:8px 0 10px}
}
@media (prefers-reduced-motion:reduce){
  .blobs i,.klx .k-body,.twinkle,.wiggle,.spray-can,.fox .f-tail{animation:none!important}
}

(() => {

/* =========================================================
   Мост «страница → приложение»: пять событий контракта.

const EVENTS = { close: 'close', finish: 'finish', vibrate: 'vibrate', share: 'share', complete: 'complete' };

    try { window.AndroidBridge && window.AndroidBridge.postMessage && window.AndroidBridge.postMessage(json); } catch (e) {}
    try { window.parent !== window && window.parent.postMessage(msg, '*'); } catch (e) {}

};

  Bridge.send('vibrate', { style: kind });

/* ================= Звук (выключен по умолчанию) ================= */
const Sound = {
  on: false, ctx: null, noise: null,
  toggle() {
    this.on = !this.on;
    if (this.on && !this.ctx) {

      if (AC) { this.ctx = new AC(); const len = this.ctx.sampleRate * .4 | 0; this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const d = this.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    document.querySelectorAll('.sound-btn').forEach(b => { b.classList.toggle('on', this.on); b.setAttribute('aria-pressed', this.on); });
    if (this.on) this.good();
  },
  tone(f, d, type = 'sine', v = .13, when = 0, f2) {

  spray() {
    if (!this.on || !this.ctx) return;

/* ================= Утилиты ================= */

function splatSVG(style = 'class="splat"') {
  const s = Math.random() * 1000 | 0, R = seeded(s);
  let dots = '';
  for (let i = 0; i < 16; i++) { const a = R() * Math.PI * 2, r = 42 + R() * 22; dots += `<circle cx="${(75 + Math.cos(a) * r).toFixed(1)}" cy="${(70 + Math.sin(a) * r * .8).toFixed(1)}" r="${(1 + R() * 3.4).toFixed(1)}"/>`; }
  let drips = '';
  for (let i = 0; i < 3; i++) { const x = 55 + R() * 40, l = 18 + R() * 30; drips += `<path class="drip" pathLength="1" d="M${x.toFixed(1)} 96v${l.toFixed(1)}" stroke-width="${(5 + R() * 4).toFixed(1)}" stroke-linecap="round" style="stroke:var(--m)"/>`; }

let G = null, loopId = 0;
const TOTAL_COINS = 10;
function newGame() {
  const used = new Set();
  const waves = WAVES.map((w, wi) => {
    const known = WAVES.slice(0, wi + 1).flatMap(x => x.tricks);
    const foxes = [];
    w.tricks.forEach(k => { const f = shuffle(FOXPOOL.filter(x => x.k === k && !used.has(x)))[0]; if (f) { used.add(f); foxes.push(f); } });
    while (foxes.length < w.fox) {
      const f = shuffle(FOXPOOL.filter(x => known.includes(x.k) && !used.has(x)))[0] || pick(FOXPOOL.filter(x => known.includes(x.k)));
      used.add(f); foxes.push(f);
    }
    const hon = shuffle(HONPOOL.filter(x => !used.has(x))).slice(0, w.hon); hon.forEach(h => used.add(h));
    let q = shuffle([...foxes, ...hon]);
    if (wi === 0) { // обучение: первым идёт Лис с кодом, вторым — друг
      const f0 = q.find(x => x.fox && x.k === 'code'), h0 = q.find(x => !x.fox);
      q = [f0, h0, ...q.filter(x => x !== f0 && x !== h0)];
    }
    return q.map(item => ({ item, retry: false }));
  });
  G = {
    waves, wi: 0, queue: [], resolved: 0, waveTotal: 1, live: [], paused: true, running: false, last: 0, sinceSpawn: 99, side: false, waveEnding: false,
    score: 0, combo: 0, maxCombo: 0, coins: TOTAL_COINS, okFriends: 0, zapped: 0, wrong: 0, missed: 0, hit: {}, miss: {},
    introduced: new Set(), tutHonest: false, spot: null, boss: null
  };
  G.foxTotal = waves.flat().filter(x => x.item.fox).length;
}

const say = html => { const s = $('#say'); if (s) s.innerHTML = `<span class="in">${html}</span>`; };
function mood(m, ms = 1200) {
  document.querySelectorAll('#dockM, .bm').forEach(el => el.dataset.mood = m);
  clearTimeout(mood.t);
  if (m !== 'idle') mood.t = setTimeout(() => document.querySelectorAll('#dockM, .bm').forEach(el => el.dataset.mood = 'idle'), ms);
}
function floatAt(el, html, cls) {
  const r = el.getBoundingClientRect(), d = document.createElement('div');
  d.className = cls; d.innerHTML = html; d.style.left = (r.left + r.width / 2) + 'px'; d.style.top = (r.top + r.height / 3) + 'px';
  fx.appendChild(d); setTimeout(() => d.remove(), 1300); return d;
}
function setScore(add, el) {
  G.score += add;
  const s = $('#score'); if (s) { s.querySelector('span').textContent = G.score; s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }
  if (el) floatAt(el, `+${add}`, 'pts');
}
function setProgress() {
  document.querySelectorAll('.waves b').forEach((b, i) => {
    let p = 0;
    if (i < 3) p = i < G.wi ? 100 : i === G.wi ? Math.min(100, G.resolved / G.waveTotal * 100) : 0;
    else if (G.boss) p = G.boss.found / G.boss.total * 100;
    b.style.width = p + '%';
  });
}
const mult = () => G.combo >= 6 ? 3 : G.combo >= 3 ? 2 : 1;
function showCombo() {
  const c = $('#combo'); if (!c) return;
  const m = mult();
  if (m < 2) { c.classList.remove('show'); return; }
  c.innerHTML = `<svg viewBox="0 0 100 56"><path d="${blobPath(50, 28, 26, 12, .1, m * 5, .16)}" fill="#111216" transform="translate(50 28) scale(1.75 1) translate(-50 -28)"/><text x="50" y="37" text-anchor="middle" font-family="Onest,sans-serif" font-weight="900" font-size="25" style="fill:var(--m)">x${m} 🔥</text></svg>`;
  c.classList.remove('show'); void c.offsetWidth; c.classList.add('show');
}

/* ---------- волны ---------- */
async function startWave(wi) {
  G.wi = wi; G.queue = G.waves[wi].slice(); G.resolved = 0; G.waveTotal = G.queue.length; G.paused = true; setProgress();
  const w = WAVES[wi], el = $('#waveIn');
  el.innerHTML = `${wi === 0 ? `<div class="wk" data-mood="happy">${klyaksik({ can: true })}</div>` : ''}
    <div class="big">Волна ${wi + 1}${DOODLE.under('var(--m)')}</div>
    <div class="hand">${wi === 0 ? 'Лис уже пишет тебе! Его уловки:' : 'Лис выучил новые уловки:'}</div>
    <div class="chips">${w.tricks.map((k, i) => `<span class="chip" style="--i:${i}">${TRICKS[k].i} ${TRICKS[k].t}</span>`).join('')}</div>
    <button class="btn" id="go">${wi === 0 ? 'Погнали!' : 'В бой!'}</button>`;
  el.classList.add('show');
  say(wi === 0 ? 'Я Кляксик! Помоги закрасить Лиса 🎨' : `Волна ${wi + 1}: Лис стал быстрее!`);
  await new Promise(r => $('#go').onclick = r);
  Sound.tap(); el.classList.remove('show');
  await countdown();
  say(wi === 0 ? 'Сообщения уже летят! Смотри внимательно 👀' : 'Погнали! 🎨');
  G.sinceSpawn = 99; G.paused = false;
  if (!G.running) { G.running = true; G.last = performance.now(); const id = ++loopId; requestAnimationFrame(t => loop(t, id)); }
}
async function countdown() {
  const field = $('#field');
  for (const n of ['3', '2', '1']) {
    const c = document.createElement('div'); c.className = 'count';
    c.innerHTML = `<span>${n}${DOODLE.burst('var(--m)')}</span>`; field.appendChild(c);
    Sound.tone(n === '1' ? 880 : 520, .12, 'triangle', .1);
    await wait(RM ? 200 : 620); c.remove();
  }
}

/* ---------- игровой цикл ---------- */
function loop(t, id) {
  if (!G || !G.running || id !== loopId) return;
  const dt = Math.min(.05, (t - G.last) / 1000); G.last = t;
  if (!G.paused) update(dt);
  requestAnimationFrame(tt => loop(tt, id));
}
function update(dt) {
  const field = $('#field'); if (!field) return;
  const H = field.clientHeight, W = field.clientWidth, w = WAVES[G.wi];
  G.sinceSpawn += dt;
  const topY = G.live.filter(b => b.state === 'fall').reduce((m, b) => Math.min(m, b.y), Infinity);
  if (G.queue.length && G.sinceSpawn > w.gap && topY > 28) spawn(G.queue.shift(), field, W);
  for (const b of G.live) {
    if (b.state !== 'fall') continue;
    b.y += H / w.T * dt; place(b);
    if (b.y > H * .2 && !b.tipped) { // подсказки «в моменте»: новая уловка или первый друг
      if (b.entry.item.fox && !G.introduced.has(b.entry.item.k)) { b.tipped = true; G.introduced.add(b.entry.item.k); newTrickTip(b); return; }
      if (!b.entry.item.fox && !G.tutHonest) { b.tipped = true; G.tutHonest = true; honestTip(b); return; }
    }
    if (b.y + b.h * .5 > H) arrive(b);
  }
  G.live = G.live.filter(b => b.state !== 'dead');
  if (!G.queue.length && !G.live.length && !G.waveEnding) waveDone();
}
function spawn(entry, field, W) {
  const it = entry.item, el = document.createElement('div');
  el.className = 'msg'; el.setAttribute('role', 'button'); el.tabIndex = 0;
  el.innerHTML = `<div class="msg-in"><div class="msg-top"><div class="msg-av">${avatar(it.av)}</div><div class="msg-meta"><b>${it.name}</b><span class="${it.warn ? 'warn' : ''}">${it.sub}</span></div></div>
    <div class="msg-text">${it.p.length > 1 ? `${it.p[0]}<span class="key">${it.p[1]}</span>${it.p[2]}` : it.p[0]}</div></div>`;
  field.appendChild(el);
  const w = el.offsetWidth, h = el.offsetHeight, room = Math.max(0, W - w - 16);
  G.side = !G.side;
  const b = { entry, el, w, h, y: -h - 6, x: 8 + (G.side ? rnd(0, room * .3) : rnd(room * .7, room)), rot: rnd(-2.5, 2.5), state: 'fall' };
  place(b); G.live.push(b); G.sinceSpawn = 0;
  el.addEventListener('pointerdown', e => { e.preventDefault(); tapMsg(b); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapMsg(b); } });
}
const place = b => { b.el.style.transform = `translate(${b.x}px,${b.y}px) rotate(${b.rot}deg)`; };

function tapMsg(b) {
  if (b.state !== 'fall') return;
  if (G.paused) {
    if (G.spot !== b) return;
    if (!b.entry.item.fox) { b.el.classList.remove('oops'); void b.el.offsetWidth; b.el.classList.add('oops'); Sound.tap(); return; }
  }
  if (b.entry.item.fox) zap(b); else wrongZap(b);
}
function foxify(b) {
  const it = b.entry.item, av = b.el.querySelector('.msg-av');
  av.innerHTML = avatar('fox'); av.classList.add('flip');
  b.el.querySelector('.msg-meta b').innerHTML = `<s>${it.name}</s><em>Лис</em>`;
  b.el.classList.add('hit');
}

function zap(b) {
  const it = b.entry.item;
  b.state = 'zapped';
  if (G.spot === b) closeTip();
  G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.zapped++; G.hit[it.k] = (G.hit[it.k] || 0) + 1;
  foxify(b);
  b.el.insertAdjacentHTML('beforeend', splatSVG() + `<div class="tag">${TRICKS[it.k].i} ${TRICKS[it.k].t}</div>`);
  setScore(10 * mult(), b.el); showCombo();
  Sound.spray(); vibrate('light');
  mood('happy'); say(mult() > 1 ? `Комбо x${mult()}! Не останавливайся 🔥` : pick(['Есть! Закрашено 🎨', 'Бах! Лис раскрыт!', 'Отличный выстрел!', 'Так его!']));
  resolved();
  setTimeout(() => {
    const r = b.el.getBoundingClientRect();
    runFox(r.left + 30, r.top + 4, false);
    b.el.classList.add('gone'); b.el.style.transform += ' scale(.6) rotate(18deg)';
    setTimeout(() => { b.el.remove(); b.state = 'dead'; }, 520);
  }, 850);
}
function runFox(x, y, withCoin) {
  const f = document.createElement('div'); f.className = 'runner';
  f.innerHTML = foxHeadSVG('caught') + (withCoin ? `<div class="rc">${ICON.coin}</div>` : '');
  f.style.left = x + 'px'; f.style.top = y + 'px'; fx.appendChild(f);
  requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transform = `translate(${innerWidth - x + 80}px,-30px) rotate(20deg)`; }));
  setTimeout(() => f.remove(), 1200);
}

function wrongZap(b) {
  b.state = 'hold'; G.combo = 0; G.wrong++; showCombo();
  b.el.classList.add('oops'); Sound.bad(); vibrate('error'); mood('oops', 2500);
  G.paused = true;
  const it = b.entry.item;
  modal(`<div class="mh"><div class="mm" data-mood="oops">${klyaksik()}</div><h3>Ой! Это был друг 💚</h3></div>
    <div class="quote">${avatar(it.av)}<div><b>${it.name} · ${it.sub}</b>${it.p[0]}</div></div>
    <p>${it.why} Друзей закрашивать не надо — пусть их сообщения долетают.</p>
    <button class="btn" id="mOk">Понятно!</button>`, () => {
    b.el.classList.add('gone'); setTimeout(() => { b.el.remove(); b.state = 'dead'; }, 500);
    requeue(b.entry); G.paused = false; say('Лиса выдают уловки, а не имя 😉');
  });
}

async function arrive(b) {
  const it = b.entry.item;
  if (!it.fox) {
    b.state = 'done'; G.okFriends++;
    const ok = $('#okStat');
    b.el.classList.add('delivered'); b.el.style.transform = `translate(${b.x}px,${b.y + 50}px) scale(.3)`;
    floatAt(ok, ICON.heart('#1FD16C'), 'heart').style.marginLeft = '-14px';
    $('#okN').textContent = G.okFriends; ok.classList.remove('wob'); void ok.offsetWidth; ok.classList.add('wob');
    setScore(5); Sound.deliver(); say(pick(['Друг на связи 💚', 'Это свои — пропускаем!', 'Сообщение доставлено 💌']));
    resolved();
    setTimeout(() => { b.el.remove(); b.state = 'dead'; }, 460);
    return;
  }
  // Лис проскочил в телефон
  b.state = 'hold'; G.paused = true; G.combo = 0; G.missed++; G.miss[it.k] = (G.miss[it.k] || 0) + 1; showCombo();
  foxify(b); vibrate('error'); mood('oops', 3000);
  await stealCoin(b);
  modal(`<div class="mh"><div class="mm" data-mood="sad">${klyaksik()}</div><h3>Лис пробрался и стащил монетку!</h3></div>
    <div class="quote">${avatar(it.av)}<div><b>${it.name} · ${it.sub}</b>${it.p[0]}<span class="key">${it.p[1]}</span>${it.p[2]}</div></div>
    <p><span class="chip">${TRICKS[it.k].i} ${TRICKS[it.k].t}</span><br><br>${TRICKS[it.k].d}</p>
    <button class="btn" id="mOk">Понятно! Поймаю в следующий раз</button>`, () => {
    b.el.classList.add('gone'); setTimeout(() => { b.el.remove(); b.state = 'dead'; }, 500);
    requeue(b.entry); G.paused = false; say('Этот Лис ещё вернётся — будь начеку!');
  });
}
async function stealCoin(b) {
  const bank = $('#bank'), pr = bank.getBoundingClientRect(), br = b.el.getBoundingClientRect();
  const coin = document.createElement('div'); coin.className = 'flycoin'; coin.innerHTML = ICON.coin;
  coin.style.left = (pr.left + 22) + 'px'; coin.style.top = (pr.top + 10) + 'px'; fx.appendChild(coin);
  G.coins = Math.max(0, G.coins - 1); $('#coinN').textContent = G.coins;
  bank.classList.remove('wob'); void bank.offsetWidth; bank.classList.add('wob');
  Sound.steal();
  await wait(30);
  coin.style.transform = `translate(${br.left + 40 - pr.left - 22}px,${br.top + 20 - pr.top - 10}px)`;
  await wait(560); coin.remove();
  runFox(br.left + 16, br.top - 6, true);
  await wait(650);
}
function requeue(entry) {
  if (!entry.retry) { G.queue.push({ item: entry.item, retry: true }); G.waveTotal++; }
  resolved();
}
function resolved() { G.resolved++; setProgress(); }

/* ---------- подсказки «в моменте» ---------- */
function showTip(html, b) {
  G.paused = true; G.spot = b;
  b.el.classList.add('spot');
  $('#dim').classList.add('show');
  const t = $('#tip'); t.innerHTML = html; t.classList.add('show');
}
function closeTip() {
  $('#tip').classList.remove('show'); $('#dim').classList.remove('show');
  if (G.spot) G.spot.el.classList.remove('spot');
  G.spot = null; G.paused = false;
}
function newTrickTip(b) {
  const k = b.entry.item.k, first = G.zapped === 0 && G.wi === 0;
  showTip(`<div class="tm" data-mood="oops">${klyaksik()}</div><div>
    <span class="chip m">Новая уловка · ${TRICKS[k].i} ${TRICKS[k].t}</span>
    <h4>${first ? 'Это Лис в маске!' : 'Осторожно, Лис!'}</h4>
    <p>${TRICKS[k].d}</p>
    <p style="margin-top:6px;font-weight:800;color:var(--ink)">👆 Тапни по сообщению — закрась его!</p></div>`, b);
  Sound.tone(660, .1, 'triangle', .1); Sound.tone(990, .14, 'triangle', .1, .08);
}
function honestTip(b) {
  showTip(`<div class="tm" data-mood="happy">${klyaksik()}</div><div>
    <span class="chip" style="background:var(--green);color:var(--ink)">💚 Это друг</span>
    <h4>А вот это — свои!</h4>
    <p>${b.entry.item.why} Друзей не трогай: пусть сообщение долетит до телефона.</p>
    <button class="btn" id="tOk">Понятно, пропускаю</button></div>`, b);
  $('#tOk').onclick = () => { Sound.tap(); closeTip(); };
}

/* ---------- модалка ---------- */
function modal(html, onClose) {
  const m = $('#modal');
  $('#mcard').innerHTML = `<svg class="deco" viewBox="0 0 110 110">${DOODLE.starO('var(--m)', 76, 30, 1.3, .1)}${DOODLE.sparkle('#111216', 50, 64, .7, .2)}</svg>` + html;
  m.classList.add('show');
  const b = $('#mOk'); if (b) b.onclick = () => { Sound.tap(); m.classList.remove('show'); onClose && onClose(); };

async function waveDone() {
  G.waveEnding = true; G.paused = true;
  Sound.good(); vibrate('success'); mood('happy', 2000);
  say(`Волна ${G.wi + 1} отбита! 🎉`);
  await wait(1000);
  G.waveEnding = false;
  if (G.wi + 1 < WAVES.length) startWave(G.wi + 1);
  else { G.wi = 3; setProgress(); startBoss(); }
}

/* ================= Босс ================= */
async function startBoss() {
  G.running = false;
  const B = pick(BOSSES), total = B.parts.filter(p => typeof p !== 'string').length;
  G.boss = { B, total, found: 0, chunks: [], firstAct: true };
  const el = $('#waveIn');
  el.innerHTML = `<div class="wk">${foxHeadSVG()}</div><div class="hand" style="margin:0 0 8px">Финал</div><div class="big">Лис-главарь${DOODLE.under('var(--pink)')}</div>
    <div class="hand" style="font-size:25px;max-width:320px">Найди и закрась все ${total} уловки в его сообщении — так ты собьёшь с него маску!</div>
    <button class="btn" id="go">На босса!</button>`;
  el.classList.add('show');
  await new Promise(r => $('#go').onclick = r);
  Sound.tap(); el.classList.remove('show');
  const box = document.createElement('div'); box.className = 'bossv'; box.id = 'boss';
  box.innerHTML = `<div class="arena"><div class="bfox" id="bfox">${foxBody(B.av)}</div>
      <div class="hp" id="hp">Лис-главарь ${Array.from({ length: total }, () => '<i></i>').join('')}</div></div>
    <div class="bchat"><div class="msg-top"><div class="msg-av">${avatar(B.av)}</div><div class="msg-meta"><b>${B.name}</b><span class="warn">${B.sub}</span></div></div>
      <div class="btext" id="btext">${B.parts.map((p, i) => { const c = typeof p === 'string' ? { t: p, k: null } : p; G.boss.chunks.push({ ...c, done: false }); return `<span class="ch ${c.k === 'link' ? 'lnk' : ''}" data-i="${i}" role="button" tabindex="0">${c.t}</span>`; }).join('')}</div></div>
    <div class="bbar"><div class="bm" data-mood="idle">${klyaksik()}</div><div class="dock-say" id="bsay" style="flex:1"><span class="in">Тапай по хитрым фразам — закрашивай уловки!</span></div><button class="ibtn" id="bhint" aria-label="Подсказка">${ICON.bulb}</button></div>`;
  $('.game').appendChild(box);
  setProgress();
  $('#btext').addEventListener('click', e => { const s = e.target.closest('.ch'); if (s) bossTap(s); });
  $('#bhint').onclick = bossHint;
}
const bsay = html => { const s = $('#bsay'); if (s) s.innerHTML = `<span class="in">${html}</span>`; };
function bossTap(el) {
  const Bs = G.boss; if (!Bs || Bs.over) return;
  const c = Bs.chunks[+el.dataset.i]; if (c.done) return;
  c.done = true;
  if (c.k) {
    el.classList.remove('hint'); el.classList.add('hitc');
    Bs.found++; G.hit[c.k] = (G.hit[c.k] || 0) + 1;
    const chat = $('.bchat'), cr = chat.getBoundingClientRect(), r = el.getClientRects()[0] || el.getBoundingClientRect(), s = document.createElement('div');
    s.className = 'bsplat';
    s.style.left = (r.left - cr.left + chat.scrollLeft + Math.min(r.width, 160) / 2 - 42) + 'px'; s.style.top = (r.top - cr.top + chat.scrollTop + r.height / 2 - 42) + 'px';
    s.innerHTML = splatSVG('style="width:100%;height:100%"'); chat.appendChild(s);
    const f = $('#bfox'); f.classList.remove('hit'); void f.offsetWidth; f.classList.add('hit');
    const segs = document.querySelectorAll('#hp i'); segs[Bs.found - 1] && segs[Bs.found - 1].classList.add('off');
    setScore(20, el); Sound.hit(); vibrate('light'); mood('happy');
    bsay(`<span><b>${TRICKS[c.k].i} ${TRICKS[c.k].t}!</b> ${TRICKS[c.k].d}</span>`);
    setProgress();
    if (Bs.found === Bs.total) { Bs.over = true; setTimeout(() => bossFinal([]), 1700); }
  } else {
    el.classList.add('miss'); Sound.tap(); mood('oops', 700);
    bsay(pick(['Мимо! Тут обычные слова 🙂', 'Здесь хитрости нет — ищи дальше!', 'Хм, это просто слова.']));
  }
}
function bossHint() {
  const Bs = G.boss; if (!Bs || Bs.over) return;
  const i = Bs.chunks.findIndex(c => c.k && !c.done); if (i < 0) return;
  $(`#btext [data-i="${i}"]`).classList.add('hint'); Sound.tap();
  bsay('Посмотри на жёлтую фразу 👀');
}
function bossFinal(disabled) {
  const Bs = G.boss, B = Bs.B;
  if (!Bs.order) Bs.order = shuffle(B.acts.map((_, i) => i));
  bsay('Маска трещит! Нанеси последний удар 💥');
  modal(`<div class="mh"><div class="mm" data-mood="happy">${klyaksik({ can: true })}</div><h3>Последний удар! Что ты сделаешь?</h3></div>
    <div class="opts">${Bs.order.map((idx, n) => `<button class="opt ${disabled.includes(idx) ? 'no' : ''}" data-a="${idx}" style="--i:${n}"><span class="oi">${B.acts[idx].e}</span><span>${B.acts[idx].t}</span></button>`).join('')}</div>`);
  document.querySelectorAll('.opt').forEach(o => o.onclick = () => bossAct(+o.dataset.a, disabled));
}
async function bossAct(idx, disabled) {
  const Bs = G.boss, a = Bs.B.acts[idx];
  $('#modal').classList.remove('show'); Sound.tap();
  await wait(250);
  if (!a.ok) {
    Bs.firstAct = false; G.wrong++; Sound.bad(); vibrate('error'); mood('oops', 2500);
    modal(`<div class="mh"><div class="mm" data-mood="sad">${klyaksik()}</div><h3>Лис хихикает… Так не стоит</h3></div><p>${a.w}</p><button class="btn" id="mOk">Выбрать другое</button>`, () => setTimeout(() => bossFinal([...disabled, idx]), 200));
    return;
  }
  if (Bs.firstAct) setScore(50, $('#bfox'));
  const fox = $('#bfox .fox'), bf = $('#bfox');
  fox.classList.add('cracking'); const cr = fox.querySelector('.crack'); if (cr) cr.style.animation = 'drawIn .4s forwards';
  Sound.spray(); vibrate('success');
  await wait(550);
  fox.classList.remove('cracking'); fox.classList.add('unmasked', 'caught'); Sound.hit();
  await wait(900);
  fox.classList.add('running'); bf.classList.add('gone'); Sound.win(); mood('happy', 3000);
  const v = document.createElement('div'); v.className = 'victory';
  v.innerHTML = `<div class="vt">${DOODLE.scribble('var(--m)')}Победа!</div>`; $('.game').appendChild(v);
  confetti();
  await wait(1700);
  v.remove();
  modal(`<div class="mh"><div class="mm" data-mood="happy">${klyaksik({ can: true })}</div><h3>Лис-главарь повержен!</h3></div><p>${a.w}</p><button class="btn" id="mOk">Смотреть результат</button>`, renderResult);
}

/* ---------- пауза / выход ---------- */
function pauseMenu() {
  if (!G || !$('#modal') || $('#modal').classList.contains('show')) return;
  const wasPaused = G.paused; G.paused = true;
  modal(`<div class="mh"><div class="mm" data-mood="idle">${klyaksik()}</div><h3>Пауза</h3></div>
    <p>Лис подождёт. А если уйдёшь — не страшно: сыграть заново можно в любой момент.</p>
    <button class="btn" id="mOk">Продолжить</button><button class="btn soft" id="mExit">Выйти из игры</button>`, () => { G.paused = wasPaused; });
  $('#mExit').onclick = () => Bridge.send('close');
}
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.running && !G.paused) pauseMenu(); });

/* ================= Результат ================= */
function renderResult() {
  G.running = false;
  const decisions = G.zapped + G.okFriends + G.wrong + G.missed;
  const acc = decisions ? Math.round((G.zapped + G.okFriends) / decisions * 100) : 100;
  const rank = acc >= 90 ? ['Легенда защиты!', 'Лис даже не понял, что произошло. Ни одна маска тебя не обманула!']
    : acc >= 70 ? ['Профи-защитник!', 'Почти все ловушки Лиса закрашены. Ещё раунд — и станешь легендой!']
    : ['Юный защитник!', 'Ты узнал главные уловки Лиса. Сыграй ещё — Лис придумает новые сообщения!'];
  const prev = store.get('klx_best');
  if (!prev || G.score > prev.score) store.set('klx_best', { score: G.score, coins: G.coins });
  const keys = Object.keys(TRICKS), weak = keys.filter(k => G.miss[k]);
  app.innerHTML = `<section class="screen result">${blobsBg()}
    <div class="row"><button class="ibtn" data-close aria-label="Закрыть">${ICON.x}</button>${soundBtn()}</div>
    <div class="r-hero" data-mood="happy"><svg viewBox="0 0 360 200">
      ${DOODLE.crown('#111216', 182, 26, 1.6, .3)}${DOODLE.starO('#FF5CE6', 60, 60, 1.3, .5)}${DOODLE.zig('#2EC5FF', 276, 40, 1.2, .7)}${DOODLE.sparkle('#FFDD2E', 300, 170, 1.3, 0)}${DOODLE.spiral('#111216', 50, 150, 1, .9)}
      <g transform="translate(262 92) rotate(18)"><svg width="64" height="70" viewBox="30 4 100 112" class="fox caught">${foxHead()}</svg></g>
      <text x="300" y="104" font-family="Caveat,cursive" font-size="26" font-weight="700" fill="#111216" transform="rotate(-8 300 104)">пока!</text>
      ${klyaksik({ can: true, attrs: 'x="104" y="42" width="150" height="150"' })}
    </svg></div>
    <div class="r-ttl">${rank[0]}</div>
    <p class="r-sub">${rank[1]}</p>
    <div class="grid2">
      <div class="sc" style="--i:0"><div class="v">${ICON.coin}<span data-count="${G.coins}">0</span><small>/${TOTAL_COINS}</small></div><div class="l">монет спасено в копилке</div><span class="bl" style="background:var(--yellow)"></span></div>
      <div class="sc" style="--i:1"><div class="v">${foxHeadSVG()}<span data-count="${G.zapped}">0</span></div><div class="l">лисов закрашено</div><span class="bl" style="background:var(--orange)"></span></div>
      <div class="sc" style="--i:2"><div class="v">${ICON.inbox}<span data-count="${G.okFriends}">0</span></div><div class="l">сообщений друзей дошло</div><span class="bl" style="background:var(--green)"></span></div>
      <div class="sc" style="--i:3"><div class="v"><span data-count="${acc}">0</span><small>%</small></div><div class="l">точность · ${G.score} очков</div><span class="bl" style="background:var(--m)"></span></div>
    </div>
    <div class="h2">Коллекция уловок</div>
    <div class="cards">${keys.map((k, i) => { const h = G.hit[k] || 0, m = G.miss[k] || 0; const cls = m ? 'miss' : h ? '' : 'none'; const st = m ? 'потренируйся' : h ? '✓ закрашено' : 'не встретил'; return `<div class="tc ${cls}" style="--i:${i}"><span class="st">${st}</span><div class="ci">${TRICKS[k].i}</div><div class="ct">${TRICKS[k].t}</div></div>`; }).join('')}</div>
    ${weak.length ? `<p class="r-sub" style="margin-top:-12px">Лис чаще проскакивал с уловками: <b>${weak.map(k => TRICKS[k].t).join(', ')}</b>. В следующий раз ты их точно заметишь!</p>` : ''}
    <div class="h2">3 правила Кляксика</div>
    <div class="rules">
      <div class="rule"><span class="rn" style="--c:var(--m)">1</span>Коды и пароли — никому. Даже «маме» в переписке.</div>
      <div class="rule"><span class="rn" style="--c:var(--pink)">2</span>Торопят, пугают или просят секрет — стоп!</div>
      <div class="rule"><span class="rn" style="--c:var(--cyan)">3</span>Сомневаешься — покажи взрослому или позвони сам.</div>
    </div>
    <div class="btns">
      <button class="btn" id="again">Играть ещё раз</button>
      <button class="btn dark" id="share">Поделиться</button>
      <button class="btn soft" id="done">Готово</button>
    </div>
  </section>`;
  setTimeout(() => app.querySelectorAll('[data-count]').forEach(countUp), 600);
  Bridge.send('complete', { score: G.score, coinsSaved: G.coins, coinsTotal: TOTAL_COINS, foxesZapped: G.zapped, wrongZaps: G.wrong, missedFoxes: G.missed, friendsDelivered: G.okFriends, accuracy: acc, maxCombo: G.maxCombo, tricksMissed: weak });
  $('#again').onclick = () => { Sound.tap(); newGame(); renderGame(); };
  $('#share').onclick = () => {
    Sound.tap();
    const text = `Я сыграл(а) в «Кляксик против Лиса» 🎨🦊\nЗакрашено лисов: ${G.zapped}, спасено монет: ${G.coins} из ${TOTAL_COINS}, точность ${acc}%!`;
    Bridge.send('share', { text });
    if (!Bridge.native() && navigator.share) navigator.share({ text }).catch(() => {});
  };
  $('#done').onclick = () => { Sound.tap(); Bridge.send('finish', { score: G.score, accuracy: acc }); };
}
function countUp(el) {
  const to = +el.dataset.count, t0 = performance.now(), dur = RM ? 1 : 900;
  const step = t => { const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function confetti() {
  if (RM) return;
  const cols = ['var(--m)', '#FF5CE6', '#2EC5FF', '#FFDD2E', '#A77BFF', '#111216'];
  const shapes = [
    c => `<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" style="fill:${c}"/></svg>`,
    c => `<svg viewBox="0 0 24 24"><path d="M2 14l5-8 5 10 5-10 5 8" style="stroke:${c}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    c => `<svg viewBox="0 0 24 24"><path d="${blobPath(12, 12, 9, 7, .2, Math.random() * 99 | 0)}" style="fill:${c}"/></svg>`,
    c => `<svg viewBox="0 0 24 24"><path d="M12 2C13 9 15 11 22 12 15 13 13 15 12 22 11 15 9 13 2 12 9 11 11 9 12 2z" style="fill:${c}"/></svg>`
  ];
  for (let i = 0; i < 60; i++) {
    const d = document.createElement('div'); d.className = 'conf';
    d.innerHTML = pick(shapes)(pick(cols));
    d.style.left = rnd(0, 100) + 'vw';
    d.style.setProperty('--d', rnd(2.2, 4) + 's'); d.style.setProperty('--dl', rnd(0, .7) + 's');
    d.style.setProperty('--dx', rnd(-90, 90) + 'px'); d.style.setProperty('--r', rnd(-500, 500) + 'deg');
    fx.appendChild(d); setTimeout(() => d.remove(), 5000);
  }
}

/* ================= Глобальные обработчики ================= */
document.addEventListener('click', e => {
  if (e.target.closest('[data-sound]')) { Sound.toggle(); return; }
  if (e.target.closest('[data-close]')) { Bridge.send('close'); return; }
  if (e.target.closest('[data-pause]')) { Sound.tap(); pauseMenu(); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('ch')) { e.preventDefault(); bossTap(e.target); }
});

renderIntro();
})();
</script>
</body>
</html>
