/* Стиль по мотивам СберKids «1dali»: белая «комната» + кислотные спреи, дудлы и блобы с глазками. */
:root{
  --bg:#F2F3F7;--card:#fff;--ink:#111216;--ink2:#2B2D35;--muted:#8B8FA0;--line:#E6E8EF;--soft:#EEF0F5;
  --lime:#C6F432;--green:#1FD16C;--cyan:#2EC5FF;--blue:#1A9BFF;--pink:#FF5CE6;--purple:#A77BFF;--yellow:#FFDD2E;--orange:#FF8A1F;--red:#FF3D6E;--fox:#FF7A1A;
  --m:#C6F432;
  --grad:linear-gradient(90deg,#27C4FF 0%,#35DE7B 55%,#C8F535 100%);
  --shadow:0 10px 30px rgba(24,26,40,.08),0 2px 6px rgba(24,26,40,.05);
  --font:"Onest","SB Sans Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Comic Sans MS",cursive;
  --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.23,1,.32,1);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--bg)}
body{font-family:var(--font);color:var(--ink);background:var(--bg);height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}
#app{height:100vh;height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
@media (min-width:560px){html,body{background:#E4E6EE}}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
svg{display:block;overflow:visible}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:screenIn .5s var(--out) both}
@keyframes screenIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

/* ---------- spray-фон ---------- */
.blobs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blobs i{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;animation:blobDrift 12s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:260px;height:260px;background:var(--lime);top:-60px;right:-70px}
.blobs i:nth-child(2){width:220px;height:220px;background:var(--pink);top:34%;left:-110px;animation-delay:-4s;opacity:.38}
.blobs i:nth-child(3){width:240px;height:240px;background:var(--cyan);bottom:-90px;right:-40px;animation-delay:-8s;opacity:.42}
@keyframes blobDrift{from{transform:translate(0,0) scale(1)}to{transform:translate(24px,30px) scale(1.12)}}

/* ---------- кнопки ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:14px 20px;border-radius:20px;
  background:var(--grad);color:var(--ink);font-weight:800;font-size:18px;letter-spacing:-.01em;width:100%;
  box-shadow:0 8px 22px rgba(46,197,255,.28),inset 0 -3px 0 rgba(0,0,0,.08);transition:transform .14s var(--out),filter .2s}
.btn:active{transform:scale(.96)}
.btn.dark{background:var(--ink);color:#fff;box-shadow:0 8px 20px rgba(17,18,22,.2)}
.btn.soft{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.ibtn{width:46px;height:46px;border-radius:15px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);flex:none;transition:transform .14s var(--out);color:var(--ink)}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:22px;height:22px}
.sound-btn .wv{opacity:0;transition:opacity .2s}
.sound-btn.on .wv{opacity:1;animation:wv 1.2s ease-in-out infinite}
.sound-btn.on .wv2{animation-delay:.2s}
.sound-btn.on .mute{opacity:0}
@keyframes wv{0%,100%{opacity:.35}50%{opacity:1}}
@media (hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.05)}.ibtn:hover{transform:translateY(-1px)}}

/* ---------- дудлы ---------- */
.draw path,.draw circle,path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawIn .9s var(--out) forwards;animation-delay:var(--d,0s)}
@keyframes drawIn{to{stroke-dashoffset:0}}
.wiggle{animation:wig 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
.twinkle{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1);opacity:1}}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}

/* ---------- Кляксик ---------- */
.klx .k-body{transform-box:fill-box;transform-origin:50% 100%;animation:kBob 2.2s ease-in-out infinite}
@keyframes kBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(.98,1.03)}}
.klx .k-eyes{transform-box:fill-box;transform-origin:center;animation:kBlink 4.2s infinite}
@keyframes kBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.klx .mo{opacity:0;transition:opacity .15s}
.klx .mo-smile{opacity:1}
[data-mood=happy] .klx .mo-smile,[data-mood=oops] .klx .mo-smile,[data-mood=sad] .klx .mo-smile{opacity:0}
[data-mood=happy] .klx .mo-happy{opacity:1}
[data-mood=oops] .klx .mo-oops{opacity:1}
[data-mood=sad] .klx .mo-sad{opacity:1}
[data-mood=happy] .klx .k-body{animation:kJump .5s var(--out) 3}
@keyframes kJump{0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.1,.88)}60%{transform:translateY(-16px) scale(.94,1.08)}}
[data-mood=oops] .klx .k-body{animation:kShake .4s linear 2}
@keyframes kShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
[data-mood=sad] .klx .k-pupils{transform:translateY(5px)}
.klx .k-drip{animation:kDrip 3.4s ease-in infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes kDrip{0%,30%{transform:scaleY(0);opacity:1}75%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1) translateY(10px);opacity:0}}
.spray-can{transform-box:fill-box;transform-origin:50% 100%;animation:canShake 1.4s ease-in-out infinite}
@keyframes canShake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(6deg)}}

/* ---------- Лис ---------- */
.fox .f-tail{transform-box:fill-box;transform-origin:0% 90%;animation:swish 1.5s ease-in-out infinite}
@keyframes swish{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.fox .f-lids{transition:transform .25s var(--out),opacity .2s}
.fox.caught .f-lids{transform:translateY(-12px);opacity:0}
.fox .f-mask{transform-box:fill-box;transform-origin:50% 50%}
.fox.cracking .f-mask{animation:jit .1s linear infinite}
@keyframes jit{0%,100%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}
.fox.unmasked .f-mask{animation:maskDrop .8s cubic-bezier(.55,0,.85,.4) forwards}
@keyframes maskDrop{to{transform:translate(40px,260px) rotate(80deg);opacity:0}}
.fox .f-leg{transform-box:fill-box;transform-origin:50% 0}
.fox.running .l1{animation:leg .15s linear infinite}
.fox.running .l2{animation:leg .15s linear infinite reverse}
@keyframes leg{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(35deg)}}
.fox .f-bang{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.fox.caught .f-bang{opacity:1;animation:pop .45s var(--spring) both}

/* модалка */
.modal{position:absolute;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(var(--safe-b) + 12px);background:rgba(17,18,22,.38);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.show{opacity:1;pointer-events:auto}
.mcard{width:100%;background:#fff;border-radius:30px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);transform:translateY(40px);transition:transform .45s var(--spring);position:relative;max-height:92%;overflow-y:auto}
.modal.show .mcard{transform:none}
.mcard .mh{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:relative;z-index:1}
.mcard .mh .mm{width:70px;height:70px;flex:none}
.mcard h3{font-weight:900;font-size:23px;line-height:1.1;letter-spacing:-.02em}
.mcard p{font-weight:600;font-size:16px;line-height:1.4;color:var(--ink2);margin:10px 0 14px}
.quote{background:var(--soft);border-radius:18px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start}
.quote svg{width:34px;height:34px;flex:none}
.quote b{display:block;font-size:13.5px;font-weight:800;color:var(--muted)}
.quote div{font-weight:700;font-size:15.5px;line-height:1.35}
.quote .key{background:linear-gradient(transparent 12%,var(--m) 12%,var(--m) 92%,transparent 92%)}
.mcard .btn+.btn{margin-top:10px}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.pts{position:absolute;font-weight:900;font-size:22px;color:var(--ink);text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;animation:ptsUp .9s var(--out) forwards;white-space:nowrap}
@keyframes ptsUp{0%{opacity:0;transform:translate(-50%,0) scale(.5)}25%{opacity:1;transform:translate(-50%,-14px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-60px)}}
.runner{position:absolute;width:56px;height:56px;transition:transform 1s cubic-bezier(.5,0,.8,.3)}
.runner svg{width:100%;height:100%}
.runner .rc{position:absolute;right:-8px;top:-8px;width:26px;height:26px}
.flycoin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;transition:transform .55s cubic-bezier(.3,.7,.4,1)}
.flycoin svg{width:28px;height:28px;animation:coinSpin .5s linear infinite}
@keyframes coinSpin{50%{transform:scaleX(.15)}}
.heart{position:absolute;width:28px;height:28px;animation:heartUp 1.2s var(--out) forwards}
.heart svg{width:28px;height:28px}
@keyframes heartUp{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:translateY(-18px) scale(1.15)}100%{opacity:0;transform:translateY(-70px) scale(.8)}}
.conf{position:absolute;top:-30px;width:26px;height:26px;animation:fall var(--d) cubic-bezier(.25,.6,.45,1) forwards;animation-delay:var(--dl)}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

/* ================= Общее ================= */
.row{display:flex;justify-content:space-between;align-items:center}
.row2{display:flex;gap:10px}
.btn.big{min-height:66px;font-size:22px;border-radius:24px;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.btn.big:active{animation:none;transform:scale(.96)}
.btn[disabled]{filter:grayscale(1);opacity:.45;animation:none;pointer-events:none}
.kick{font-family:var(--hand);font-weight:700;font-size:26px;line-height:1}
.ttl{font-weight:900;font-size:clamp(34px,10vw,46px);line-height:.98;letter-spacing:-.03em;position:relative}
.ttl .u{position:relative;display:inline-block;z-index:0}

/* ================= Старт / выбор ================= */
.start{padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 18px)}

/* ================= День: сцена ================= */
.stage{background:#DDF3FF}
.sky{position:absolute;inset:0;background:linear-gradient(#BFE8FF,#E8F7FF 40%,#F2F3F7 70%);transition:background 2s}
.sky.eve{background:linear-gradient(#FF9F6B,#FFC9C2 38%,#FBE6EF 70%)}
.sky.rainy{background:linear-gradient(#9AA6BC,#C9D2E0 45%,#E3E7EE 75%)}
.sky>svg{position:absolute;left:0;right:0;bottom:120px;width:100%;height:72%}
.wheel{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{animation:drift 30s linear infinite}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(480px)}}
.flag{transform-box:fill-box;transform-origin:50% 0;animation:flag 2.4s ease-in-out infinite}
@keyframes flag{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

.lit .bulbs::before{content:"";position:absolute;left:0;right:0;top:3px;height:2.5px;background:#111216;opacity:.6}
.bulbs i{position:relative;width:17px;height:17px;border-radius:50%;background:#FFF6CC;border:2.5px solid #111216;opacity:0;transform:scale(.3);transition:opacity .3s,transform .5s var(--spring)}
.lit .bulbs i{opacity:1;transform:none;animation:bulb 1s steps(1) infinite}
.lit .bulbs i:nth-child(even){animation-delay:-.5s}
@keyframes bulb{0%{background:#FFE14D;box-shadow:0 0 0 4px rgba(255,225,77,.45)}50%{background:#FF9CEF;box-shadow:0 0 0 4px rgba(255,92,230,.35)}}
.hud{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 8px);z-index:8;display:flex;align-items:center;gap:8px;padding:0 12px}
.meters{flex:1;display:flex;gap:6px;justify-content:center;min-width:0}
.meter{display:flex;align-items:center;gap:5px;background:#fff;border-radius:15px;padding:0 9px;height:44px;box-shadow:var(--shadow);min-width:0}
.meter svg.mi{width:22px;height:22px;flex:none}
.meter .mb{width:clamp(36px,14vw,70px);height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.meter .mb i{display:block;height:100%;border-radius:6px;transition:width .6s var(--out)}
.meter.rep .mb i{background:linear-gradient(90deg,#FF5CE6,#FF3D6E)}
.meter.sh .mb i{background:linear-gradient(90deg,#2EC5FF,#1A9BFF)}
.meter.up{animation:bump .5s var(--spring)}
.meter.down{animation:wob .5s}
@keyframes bump{40%{transform:scale(1.15)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.yard{position:relative;flex:1;min-height:0;z-index:3}
.cust{position:absolute;left:50%;bottom:86px;height:min(230px,calc(100% - 190px));aspect-ratio:160/196;transform:translateX(-50%);z-index:2}
.cust .cw{width:100%;height:100%;animation:walkIn .65s var(--out) both}
.cust .cw>svg{width:100%;height:100%;animation:bob 1.5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes walkIn{0%{transform:translateX(110vw) rotate(10deg)}70%{transform:translateX(-14px) rotate(-3deg)}100%{transform:none}}
@keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.97) translateY(2px)}}
.cust.out-happy .cw{animation:outHappy .7s ease-in forwards}

.cust.out-angry .cw{animation:outAngry 1s ease-in forwards}
@keyframes outAngry{0%,30%{transform:none}10%,25%{transform:translateX(-8px)}18%{transform:translateX(8px)}100%{transform:translateX(110vw)}}
.cust.shake .cw{animation:wob .45s}
.cust.yay .cw{animation:yay .5s var(--out) 2}
@keyframes yay{50%{transform:translateY(-22px)}}
.say{position:absolute;left:50%;top:auto;bottom:calc(98px + min(230px,100% - 190px));transform:translateX(-50%);z-index:5;background:#fff;border-radius:26px;padding:12px 18px;box-shadow:0 12px 30px rgba(24,26,40,.14);font-weight:800;font-size:18px;line-height:1.25;text-align:center;width:max-content;max-width:calc(100% - 28px);animation:sayIn .45s var(--spring) both}
@keyframes sayIn{from{opacity:0;transform:translateX(-50%) scale(.5) translateY(30px)}to{opacity:1;transform:translateX(-50%) scale(1)}}

.say.order>svg{width:54px;height:54px}

.say.order .x{font-size:30px}

.say .pat i{display:block;height:100%;width:100%;background:var(--green);border-radius:4px;transform-origin:left;animation:pat linear forwards}
@keyframes pat{0%{transform:scaleX(1);background:var(--green)}60%{background:var(--yellow)}100%{transform:scaleX(0);background:var(--red)}}
.say.event{background:var(--ink);color:#fff}
.say.event::after{border-top-color:var(--ink)}
.opts{position:absolute;left:10px;right:10px;bottom:4px;display:flex;gap:8px;justify-content:center;z-index:6}
.op{flex:1;max-width:124px;min-height:84px;background:#fff;border-radius:24px;box-shadow:0 10px 24px rgba(24,26,40,.16);padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;animation:pop .4s var(--spring) both;animation-delay:calc(.15s + var(--i)*.08s);transition:transform .12s var(--out)}
.op:active{transform:scale(.92)}
.op b{font-size:36px;line-height:1;font-weight:400}
.op span{font-weight:800;font-size:13.5px;line-height:1.1;text-align:center}
.op.off{opacity:.42;filter:grayscale(.8);pointer-events:none}
.op .bdg{position:absolute;right:-6px;top:-8px;background:var(--ink);color:#fff;font-weight:900;font-size:12px;padding:3px 7px;border-radius:9px;display:flex;align-items:center;gap:2px}
.op .bdg svg{width:14px;height:14px}
.op.pick{transform:scale(1.08);box-shadow:0 0 0 4px var(--m),0 10px 24px rgba(24,26,40,.16)}
.op.glow{animation:glowP 1s ease-in-out infinite}
@keyframes glowP{0%,100%{box-shadow:0 0 0 0 rgba(198,244,50,0),0 10px 24px rgba(24,26,40,.16)}50%{box-shadow:0 0 0 7px var(--m),0 10px 24px rgba(24,26,40,.16)}}
.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:20;background:var(--ink);color:#fff;font-weight:900;font-size:18px;padding:10px 16px;border-radius:18px;white-space:nowrap;pointer-events:none;animation:toast 2.2s var(--out) forwards;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.toast.r{background:var(--red)}
.toast.g{background:var(--green);color:var(--ink)}
@keyframes toast{0%{opacity:0;transform:translateX(-50%) scale(.4) rotate(-6deg)}12%{opacity:1;transform:translateX(-50%) scale(1.08) rotate(-2deg)}22%{transform:translateX(-50%) scale(1) rotate(-2deg)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px) rotate(-2deg)}}
.tipl{position:absolute;left:12px;right:12px;bottom:6px;z-index:7;background:var(--yellow);border-radius:20px;padding:10px 14px 10px 10px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;line-height:1.25;box-shadow:0 10px 24px rgba(0,0,0,.15);animation:tipIn 3.4s var(--out) forwards;pointer-events:none}
.tipl svg{width:34px;height:34px;flex:none}
@keyframes tipIn{0%{opacity:0;transform:translateY(30px)}10%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0;transform:translateY(10px)}}
.rain{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;z-index:4;overflow:hidden}
.rain.on{opacity:1}

@keyframes drop{to{transform:translateY(110vh)}}
.counter{position:relative;z-index:6;flex:none;background:#fff;border-radius:30px 30px 0 0;box-shadow:0 -10px 30px rgba(24,26,40,.1);padding:12px 12px calc(var(--safe-b) + 12px);display:flex;align-items:flex-end;justify-content:space-between;gap:6px;min-height:118px}
.counter::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;border-radius:30px 30px 0 0;background:repeating-linear-gradient(90deg,var(--aw1) 0 26px,var(--aw2) 26px 52px)}
.ci{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}

.scene{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);background:rgba(242,243,247,.97);opacity:0;pointer-events:none;transition:opacity .35s;overflow-y:auto}

.scene{justify-content:flex-start}
.scene>*{margin:auto 0;flex:none}

/* ================= Детектив ================= */

.phone{width:min(280px,78vw);background:#111216;border-radius:38px;padding:14px;box-shadow:0 24px 50px rgba(0,0,0,.25);animation:pop .5s var(--spring) both;position:relative}

.det .btn{margin-top:14px;max-width:300px}

}

/* перетаскивание ингредиента (тап тоже работает) */
function dragIng(btn, target, onDrop, blocked) {
  btn.addEventListener('pointerdown', ev => {
    if (blocked()) return;
    ev.preventDefault();
    const g = document.createElement('div'); g.className = 'dragc'; g.innerHTML = btn.innerHTML;
    g.style.left = ev.clientX + 'px'; g.style.top = ev.clientY + 'px'; document.body.appendChild(g);
    const x0 = ev.clientX, y0 = ev.clientY; let moved = false;
    const mv = e => { g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; if (Math.hypot(e.clientX - x0, e.clientY - y0) > 10) moved = true; };
    const up = e => {
      removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      const r = target.getBoundingClientRect();
      const over = e.clientX > r.left - 16 && e.clientX < r.right + 16 && e.clientY > r.top - 16 && e.clientY < r.bottom + 16;
      if (over) { g.remove(); onDrop(); return; }
      if (!moved) { // тап: ингредиент сам летит в стакан
        g.classList.add('flyc'); g.style.transform = `translate(${r.left + r.width / 2 - e.clientX}px,${r.top + r.height / 2 - e.clientY}px) scale(.8)`;
        setTimeout(() => { g.remove(); onDrop(); }, 300); return;
      }
      g.remove();
    };
    addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
}

/* наглядное обучение в телефоне: сообщение останавливается, рука показывает действие */
function phoneTut(fp, field, me) {
  let touch = 0;
  fp.addEventListener('pointerdown', () => { touch = performance.now(); }, true);
  return {
    // подпись над сообщением
    hint(b, html, cls = '') { const t = document.createElement('div'); t.className = 'thint ' + cls; t.innerHTML = html; t.style.top = Math.max(6, b.y - 48) + 'px'; field.appendChild(t); return t; },
    slide: async (b, y, ms) => { b.el.style.transition = `transform ${ms}ms ${ms > 1000 ? 'linear' : 'cubic-bezier(.2,.8,.2,1)'}`; b.y = y; b.el.style.transform = `translate(${b.x}px,${b.y}px)`; await pwait(ms); b.el.style.transition = ''; },
    // держим руку-подсказку, пока ребёнок не сделает действие (после касания — пауза, чтобы не мешать)
    async show(b, el, toEl) {
      while (D === me && b.st === 'fall') {
        if (!fp.querySelector('.coach .ghand') && performance.now() - touch > 1500) coachTap(el, null, fp, toEl);
        await pwait(300);

      coachOff();
    },
    async go(html) { const g = document.createElement('div'); g.className = 'pgo'; g.innerHTML = html; field.appendChild(g); Sound.pop(); await pwait(1400); g.remove(); }
  };
}

        const H = field.clientHeight;
        S.since += dt;
        const topY = S.live.filter(b => b.st === 'fall').reduce((m, b) => Math.min(m, b.y), Infinity);
        if (S.q.length && S.since > gap && topY > 30) spawn(S.q.shift());
        for (const b of S.live) {
          if (b.st !== 'fall') continue;
          b.y += (H + b.h) / T * dt; b.el.style.transform = `translate(${b.x}px,${b.y}px)`;
          if (b.y > H - b.h - 6) land(b);
        }
        S.live = S.live.filter(b => b.st !== 'dead');
        if (!S.q.length && !S.live.length) { S.done = true; finish(); return; }
      }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    const finish = async () => {
      const all = S.zap === nFox && !S.oops;
      const ds = all ? 2 : S.zap >= S.miss ? 1 : -S.miss;
      const fp = ov.querySelector('.pphone');
      fp.insertAdjacentHTML('beforeend', `<div class="pres">${mc('fox', S.miss ? 'happy' : 'sad', ['glasses'])}
        <b>${all ? 'Лис раскрыт!' : S.miss ? 'Лис кое-что утащил' : 'Почти всех поймал!'}</b>
        <div class="prow2"><span class="g">${ic('check')} ${S.zap}/${nFox}</span>${S.lost ? `<span class="r">${ic('coin')} −${S.lost}</span>` : ''}${S.oops ? `<span class="r">${ic('heartBreak')} ${S.oops}</span>` : ''}</div>
        <button class="btn" id="pdone">К прилавку ${ic('play')}</button></div>`);
      if (all) Sound.win(); else Sound.tap();
      meter('sh', ds);
      D.moments.push({ t: `${ic('phone')} Лис: ${S.zap}/${nFox}${S.lost ? ` · −${S.lost} ${ic('coin')}` : ''}`, c: S.miss ? 'r' : 'g' });
      D.foxZap = (D.foxZap || 0) + S.zap; D.foxMiss = (D.foxMiss || 0) + S.miss;
      await new Promise(r => { fp.querySelector('#pdone').onclick = () => { if (!D.paused) r(); }; });
      Sound.tap(); ov.classList.add('out'); await pwait(300); ov.remove(); res();
    };
  });
}

/* ---------- Ситуации ---------- */
const NOSTOCK = { i: 'meh', t: 'Нечего дать', fx: { r: -1 }, exit: 'sad', res: () => `${pi(D.prod)} Всё раскупили` };
const money = () => D.wallet;
function optAvail(o) {
  if (o.needStock && D.stock < o.needStock) return false;
  if (o.cost) return money() >= o.cost;
  return true;
}
function optBadge(o) {
  if (o.cost) return `<span class="bdg">−${o.cost}${ic('coin')}</span>`;
  if (o.needStock) return `<span class="bdg w">−${o.needStock}${pi(D.prod)}</span>`;
  return '';
}
function choose(opts) {
  const box = document.createElement('div'); box.className = 'opts';
  box.innerHTML = opts.map((o, i) => `<button class="op ${optAvail(o) ? '' : 'off'}" data-i="${i}" style="--i:${i}">${optBadge(o)}${ic(o.i, 'oi')}<span>${o.t}</span></button>`).join('');
  $('#yard').appendChild(box);
  return new Promise(res => box.querySelectorAll('.op').forEach(b => b.onclick = () => {
    if (D.paused) return;
    b.classList.add('pick'); Sound.tap(); vibrate();
    box.querySelectorAll('.op').forEach(x => { x.onclick = null; });
    setTimeout(() => { box.remove(); res(+b.dataset.i); }, 200);
  }));
}
async function storyEnc(id) {
  const me = D, S = ST[id], P = PRODS[D.prod];
  const c = custIn(S.art ? S.art() : critter(S.who[0], S.md || 'idle', S.who[1]));
  if (id === 'rain') { $('#rain').classList.add('on'); $('#sky').classList.add('rainy'); }
  await pwait(600); if (D !== me) return;
  const b = sayB(S.say(P), S.ev ? 'event' : '');
  // если товар кончился и выбрать нечего — запасной вариант, чтобы день не застрял
  const own = S.opts.filter(o => !o.broke || money() < 10);   // «в долг» — только когда денег совсем нет
  const opts = own.some(optAvail) ? own : [...own, NOSTOCK];
  const idx = await choose(opts);
  if (D !== me) return;
  coachOff(); b.remove();
  let o = opts[idx];
  if (o.ref) o = ST[o.ref];
  if (o.detect) { const ok = await detective(); if (D !== me) return; o = ST[ok ? 'detOk' : 'detFail']; }
  const f = typeof o.fx === 'function' ? o.fx(D) : { ...(o.fx || {}) };
  await applyFx(f, c);
  if (D !== me) return;
  if (id === 'rain') { $('#rain').classList.remove('on'); $('#sky').classList.remove('rainy'); }
  const bad = o.bad && !f.lucky;
  const empty = f.scam && !f.m && !f.st;   // жулик пришёл к пустой кассе
  const res = empty ? `${ic('coin')} Касса пустая — красть нечего!` : typeof o.res === 'function' ? o.res(f) : o.res;
  if (res) toast(res, bad ? 'r' : (f.r > 0 || f.s > 0 ? 'g' : ''));
  const mm = !empty && o.mom && o.mom(f); if (mm) D.moments.push(mm);
  if (bad) { Sound.bad(); vibrate('error'); mood('oops', 2200); if (o.tip) setTimeout(() => D === me && tipLine(o.tip), 600); }
  else if (f.r > 0 || f.s > 0) { Sound.good(); mood('happy'); }
  if (!S.ev && !S.art) {
    const md = bad ? (o.exit === 'run' ? 'happy' : 'sly') : (o.exit === 'happy' ? 'happy' : o.exit === 'angry' ? 'angry' : 'sad');
    c.querySelector('.cw').innerHTML = critter(S.who[0], md, o.exit === 'run' && bad ? [...S.who[1].filter(a => a !== 'phone'), 'bag'] : S.who[1]);
  }
  await pwait(500); if (D !== me) return;
  custOut(c, S.ev ? 'sad' : (o.exit || 'happy'));
  await pwait(bad ? 2600 : 1100);
}
async function applyFx(f, c) {
  const till = $('#till'), stock = $('#stock');
  if (f.pay) f.m = (f.m || 0) - f.pay;
  if (f.st < 0) { const n = Math.min(-f.st, D.stock); f.st = -n; if (n) { D.stock -= n; itemsFly(stock, c, n); bumpEl(stock, 'hurt'); } }
  if (f.st > 0) { D.stock += f.st; itemsFly(c, stock, 6); bumpEl(stock); }
  if (f.m < 0 && f.scam) { const n = Math.min(-f.m, D.wallet); f.m = -n; if (n) { D.wallet -= n; coinsFly(till, c, n); bumpEl(till, 'hurt'); Sound.steal(); } }
  else if (f.m < 0) {
    const w = Math.min(-f.m, D.wallet); D.wallet -= w; f.m = -w;
    if (w) { coinsFly(till, c, w); bumpEl(till, 'hurt'); }
    Sound.coin();
  }
  if (f.m > 0) { D.wallet += f.m; coinsFly(c, till, f.m); bumpEl(till); Sound.cash(); }
  updAll();
  if (f.r) meter('rep', f.r);
  if (f.s) meter('sh', f.s);
  if (f.scam) D.scammed++;
  if (f.later) D.later.push(f.later);
  if (f.skip) { let k = f.skip; for (let j = D.i + 1; j < D.q.length && k; j++) if (D.q[j].t !== 's') { D.q.splice(j, 1); j--; k--; D.missed++; } }
  if (f.sign) {
    D.sign = true; $('#stage').classList.add('lit'); Sound.win();
    for (let k = 0; k < 3; k++) { const j = D.i + 2 + Math.floor(Math.random() * (D.q.length - D.i - 1)); const kk = pick(BUYERS); D.q.splice(j, 0, { t: pick(['b', 'mix']), k: kk, n: 2 + (Math.random() * 2 | 0), acc: [] }); }
  }
  await pwait(450);
}

/* ================= Мини-детектив: скриншот «перевода» ================= */
function detective() {
  const sc = $('#scene');
  const bads = shuffle([['bank', 'Сбирбанк', 'Опечатка!'], ['coin', 'Сумма: 3', 'Надо 30!'], ['calendar', '32 мая', 'Нет такого дня!'], ['clock', '25:70', 'Нет такого времени!']]).slice(0, 3);
  const rows = shuffle([...bads.map(b => ({ e: b[0], t: b[1], lb: b[2], bad: 1 })), { e: 'user', t: 'Енот Е.' }, { e: 'chat', t: 'За покупку' }]);
  sc.innerHTML = `<div class="det"><div class="dh">${ic('magnifier')} Найди 2 подвоха</div><div class="dots"><i></i><i></i></div>
    <div class="phone"><div class="notch"></div><div class="scr"><div class="okc">${IC.check ? `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ''}</div><div class="ph">Перевод выполнен</div>
    ${rows.map((r, i) => `<button class="prow" data-i="${i}">${ic(r.e)}${r.t}</button>`).join('')}</div></div>
    <button class="btn soft" id="trust">Ладно, верю ${ic('meh')}</button></div>`;
  sc.classList.add('show'); Sound.pop();
  return new Promise(res => {
    let found = 0;
    sc.querySelectorAll('.prow').forEach(b => b.onclick = () => {
      const r = rows[+b.dataset.i];
      if (!r.bad) { b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope'); Sound.tap(); return; }
      if (b.classList.contains('found')) return;
      found++; b.classList.add('found');
      b.insertAdjacentHTML('beforeend', `<svg class="ring" viewBox="0 0 200 50" preserveAspectRatio="none"><path class="draw" pathLength="1" d="M100 4C160 2 196 12 194 25s-40 22-94 21S4 38 6 24 50 4 108 6" stroke="#FF3D6E" stroke-width="4" fill="none" stroke-linecap="round"/></svg><span class="lb">${r.lb}</span>`);
      sc.querySelectorAll('.dots i')[found - 1].classList.add('on');
      Sound.spray(); vibrate('light');
      if (found === 2) { sc.querySelectorAll('.prow').forEach(x => { x.onclick = null; }); Sound.win(); setTimeout(() => { sc.classList.remove('show'); res(true); }, 1100); }
    });
    $('#trust').onclick = () => { Sound.tap(); sc.classList.remove('show'); res(false); };
  });
}

/* ================= Вечер ================= */
async function evening() {
  const me = D;
  setSun(1.08); $('#sky').classList.add('eve'); toast(`${ic('moon')} Вечер! Закрываемся`);
  await pwait(1500); if (D !== me) return;
  for (const L of D.later) {
    if (L === 'loan') {
      const back = Math.random() < .7;
      const c = custIn(critter('kitten', back ? 'happy' : 'sad', ['bow']));
      await pwait(650); if (D !== me) return;
      const b = sayB(back ? `Возвращаю долг! И +5 сверху ${ic('heart')}` : `Ой… я всё потратил ${ic('sad')}`);
      if (back) { coinsFly(c, $('#till'), 25); D.wallet += 25; updAll(); Sound.cash(); D.moments.push({ t: `${mc('kitten', 'happy', ['bow'])} +25 ${ic('coin')}`, c: 'g' }); }
      else { Sound.bad(); D.moments.push({ t: `${mc('kitten', 'sad', ['bow'])} −20 ${ic('coin')}`, c: 'r' }); }
      await pwait(1700); b.remove(); custOut(c, back ? 'happy' : 'sad'); await pwait(700);
    }
    if (L === 'debt') {
      const c = custIn(critter('bear', 'idle', ['hardhat']));
      await pwait(650); if (D !== me) return;
      const n = Math.min(15, D.wallet), b = sayB(`Должок: 15 ${ic('coin')}`);
      if (n) { coinsFly($('#till'), c, n); D.wallet -= n; updAll(); bumpEl($('#till'), 'hurt'); Sound.coin(); }
      D.moments.push({ t: `${ic('handshake')} Долг −${n} ${ic('coin')}`, c: 'r' });
      await pwait(1500); b.remove(); custOut(c, 'happy'); await pwait(700);
    }
    if (L === 'invest') {
      const c = custIn(critter('beaver', 'happy', ['tie', 'bag']));
      await pwait(500); custOut(c, 'run'); toast(`${mc('beaver', 'sly')} Бобёр с деньгами не вернулся`, 'r');
      D.moments.push({ t: `${mc('beaver')} −40 ${ic('coin')}`, c: 'r' }); await pwait(1800);
    }
    if (D !== me) return;
  }
  if (D.stock > 0) D.moments.push({ t: `${ic('box')} Осталось ${D.stock} ${pi(D.prod)}`, c: '' });
  showSummary();
}
function showSummary() {
  D.over = true;
  const profit = D.wallet - START_MONEY;
  const stat = { rep: D.rep, shield: D.shield, profit, scammed: D.scammed, sign: D.sign };
  const T = TITLES.find(t => t.ok(stat)); SESSION.titles.add(T.id);
  const sc = $('#scene');
  const moms = [{ t: `${pi(D.prod)} Продано ${D.sold}`, c: 'g' }];
  if (D.mixOk + D.mixBad) moms.push({ t: `${ic(RECIPES[D.prod].fl[0][0])} Заказы ${D.mixOk}/${D.mixOk + D.mixBad}`, c: D.mixBad ? '' : 'g' });
  if (D.chgOk + D.chgBad) moms.push({ t: `${ic('coinsBack')} Сдача ${D.chgOk}/${D.chgOk + D.chgBad}`, c: D.chgBad ? '' : 'g' });
  sc.innerHTML = `<div class="eve">
    <div class="kick">Лавка закрыта ${ic('moon')}</div>
    <div class="medal">${medalSVG(T)}</div>
    <div class="etitle">${T.t}</div>
    <div class="estats">
      <div class="es" style="--i:0">${ic('coin')}<b class="${profit < 0 ? 'neg' : ''}">${profit >= 0 ? '+' : ''}${profit}</b></div>
      <div class="es" style="--i:2">${ic('heart')}<b>${D.rep}/10</b></div>
      <div class="es" style="--i:3">${ic(D.shield >= 4 ? 'shield' : 'shieldX')}<b>${D.shield}/10</b></div>
    </div>
    <div class="moms">${[...moms, ...D.moments].slice(0, 9).map((m, i) => `<span class="mom ${m.c}" style="--i:${i}">${m.t}</span>`).join('')}</div>
    <div class="tcol">${TITLES.map(t => `<span class="${SESSION.titles.has(t.id) ? '' : 'off'}" title="${t.t}">${medalSVG(t, false)}</span>`).join('')}</div>
    <div class="tcap">Титулы: ${SESSION.titles.size} из ${TITLES.length}. Собери все!</div>
    <div class="btns"><button class="btn big" id="again">Новый день ${ic('repeat')}</button>
      <div class="row2"><button class="btn dark" id="share">Поделиться</button><button class="btn soft" id="done">Готово</button></div></div>
  </div>`;
  sc.classList.add('show');
  Sound.win(); if (profit > 0) setTimeout(confetti, 400);
  Bridge.send('complete', { title: T.id, profit, reputation: D.rep, safety: D.shield, scammed: D.scammed, sold: D.sold, missedBuyers: D.missed, foxZapped: D.foxZap || 0, foxMissed: D.foxMiss || 0, ordersRight: D.mixOk, ordersWrong: D.mixBad, changeRight: D.chgOk, changeWrong: D.chgBad, signBought: D.sign, product: D.prod, titlesCollected: [...SESSION.titles] });
  $('#again').onclick = () => { Sound.tap(); randomStall(); };
  $('#share').onclick = () => {
    Sound.tap();
    const text = `Я провёл(а) день в «Лавке на один день» и стал(а) «${T.t}»! Прибыль: ${profit} монет. А ты?`;
    Bridge.send('share', { text });
    if (!Bridge.native() && navigator.share) navigator.share({ text }).catch(() => {});
  };
  $('#done').onclick = () => { Sound.tap(); Bridge.send('finish', { title: T.id, profit }); };
}

/* ================= Глобальные обработчики ================= */
document.addEventListener('click', e => {
  if (e.target.closest('[data-sound]')) { Sound.toggle(); return; }
  if (e.target.closest('[data-close]')) { Bridge.send('close'); return; }
  if (e.target.closest('[data-home]')) { Sound.tap(); renderStart(); return; }
  if (e.target.closest('[data-pause]')) { Sound.tap(); pauseMenu(); }
});
renderStart();
})();
</script>
