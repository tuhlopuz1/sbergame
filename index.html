<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F2F3F7">
<meta name="color-scheme" content="light">
<title>Кляксик спасает город</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
/* Стиль по мотивам СберKids «1dali»: белая «комната» + кислотные спреи, дудлы и блобы с глазками. */
:root{
  --bg:#F2F3F7;--card:#fff;--ink:#111216;--ink2:#2B2D35;--muted:#8B8FA0;--line:#E6E8EF;--soft:#EEF0F5;
  --lime:#C6F432;--green:#1FD16C;--cyan:#2EC5FF;--blue:#1A9BFF;--pink:#FF5CE6;--purple:#A77BFF;--yellow:#FFDD2E;--orange:#FF8A1F;--red:#FF3D6E;--fox:#FF7A1A;
  --m:#C6F432;
  --grad:linear-gradient(90deg,#27C4FF 0%,#35DE7B 55%,#C8F535 100%);
  --shadow:0 10px 30px rgba(24,26,40,.08),0 2px 6px rgba(24,26,40,.05);
  --font:"Onest","SB Sans Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Comic Sans MS",cursive;
  --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.23,1,.32,1);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--bg)}
body{font-family:var(--font);color:var(--ink);background:var(--bg);height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}
#app{height:100vh;height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
@media (min-width:560px){html,body{background:#E4E6EE}}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
svg{display:block;overflow:visible}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:screenIn .5s var(--out) both}
@keyframes screenIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

/* ---------- spray-фон ---------- */
.blobs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blobs i{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;animation:blobDrift 12s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:260px;height:260px;background:var(--lime);top:-60px;right:-70px}
.blobs i:nth-child(2){width:220px;height:220px;background:var(--pink);top:34%;left:-110px;animation-delay:-4s;opacity:.38}
.blobs i:nth-child(3){width:240px;height:240px;background:var(--cyan);bottom:-90px;right:-40px;animation-delay:-8s;opacity:.42}
@keyframes blobDrift{from{transform:translate(0,0) scale(1)}to{transform:translate(24px,30px) scale(1.12)}}

/* ---------- кнопки ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:14px 20px;border-radius:20px;
  background:var(--grad);color:var(--ink);font-weight:800;font-size:18px;letter-spacing:-.01em;width:100%;
  box-shadow:0 8px 22px rgba(46,197,255,.28),inset 0 -3px 0 rgba(0,0,0,.08);transition:transform .14s var(--out),filter .2s}
.btn:active{transform:scale(.96)}
.btn.dark{background:var(--ink);color:#fff;box-shadow:0 8px 20px rgba(17,18,22,.2)}
.btn.soft{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.ibtn{width:46px;height:46px;border-radius:15px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);flex:none;transition:transform .14s var(--out);color:var(--ink)}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:22px;height:22px}
.sound-btn .wv{opacity:0;transition:opacity .2s}
.sound-btn.on .wv{opacity:1;animation:wv 1.2s ease-in-out infinite}
.sound-btn.on .wv2{animation-delay:.2s}
.sound-btn.on .mute{opacity:0}
@keyframes wv{0%,100%{opacity:.35}50%{opacity:1}}
@media (hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.05)}.ibtn:hover{transform:translateY(-1px)}}

/* ---------- дудлы ---------- */
.draw path,.draw circle,path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawIn .9s var(--out) forwards;animation-delay:var(--d,0s)}
@keyframes drawIn{to{stroke-dashoffset:0}}
.wiggle{animation:wig 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
.twinkle{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1);opacity:1}}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}

/* ---------- Кляксик ---------- */
.klx .k-body{transform-box:fill-box;transform-origin:50% 100%;animation:kBob 2.2s ease-in-out infinite}
@keyframes kBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(.98,1.03)}}
.klx .k-eyes{transform-box:fill-box;transform-origin:center;animation:kBlink 4.2s infinite}
@keyframes kBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.klx .mo{opacity:0;transition:opacity .15s}
.klx .mo-smile{opacity:1}
[data-mood=happy] .klx .mo-smile,[data-mood=oops] .klx .mo-smile,[data-mood=sad] .klx .mo-smile{opacity:0}
[data-mood=happy] .klx .mo-happy{opacity:1}
[data-mood=oops] .klx .mo-oops{opacity:1}
[data-mood=sad] .klx .mo-sad{opacity:1}
[data-mood=happy] .klx .k-body{animation:kJump .5s var(--out) 3}
@keyframes kJump{0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.1,.88)}60%{transform:translateY(-16px) scale(.94,1.08)}}
[data-mood=oops] .klx .k-body{animation:kShake .4s linear 2}
@keyframes kShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
[data-mood=sad] .klx .k-pupils{transform:translateY(5px)}
.klx .k-drip{animation:kDrip 3.4s ease-in infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes kDrip{0%,30%{transform:scaleY(0);opacity:1}75%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1) translateY(10px);opacity:0}}
.spray-can{transform-box:fill-box;transform-origin:50% 100%;animation:canShake 1.4s ease-in-out infinite}
@keyframes canShake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(6deg)}}

/* ---------- Лис ---------- */
.fox .f-tail{transform-box:fill-box;transform-origin:0% 90%;animation:swish 1.5s ease-in-out infinite}
@keyframes swish{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.fox .f-lids{transition:transform .25s var(--out),opacity .2s}
.fox.caught .f-lids{transform:translateY(-12px);opacity:0}
.fox .f-mask{transform-box:fill-box;transform-origin:50% 50%}
.fox.cracking .f-mask{animation:jit .1s linear infinite}
@keyframes jit{0%,100%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}
.fox.unmasked .f-mask{animation:maskDrop .8s cubic-bezier(.55,0,.85,.4) forwards}
@keyframes maskDrop{to{transform:translate(40px,260px) rotate(80deg);opacity:0}}
.fox .f-leg{transform-box:fill-box;transform-origin:50% 0}
.fox.running .l1{animation:leg .15s linear infinite}
.fox.running .l2{animation:leg .15s linear infinite reverse}
@keyframes leg{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(35deg)}}
.fox .f-bang{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.fox.caught .f-bang{opacity:1;animation:pop .45s var(--spring) both}

/* модалка */
.modal{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(var(--safe-b) + 12px);background:rgba(17,18,22,.38);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.show{opacity:1;pointer-events:auto}
.mcard{width:100%;background:#fff;border-radius:30px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);transform:translateY(40px);transition:transform .45s var(--spring);position:relative;max-height:92%;overflow-y:auto}
.modal.show .mcard{transform:none}
.mcard .mh{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:relative;z-index:1}
.mcard .mh .mm{width:70px;height:70px;flex:none}
.mcard h3{font-weight:900;font-size:23px;line-height:1.1;letter-spacing:-.02em}
.mcard p{font-weight:600;font-size:16px;line-height:1.4;color:var(--ink2);margin:10px 0 14px}
.quote{background:var(--soft);border-radius:18px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start}
.quote svg{width:34px;height:34px;flex:none}
.quote b{display:block;font-size:13.5px;font-weight:800;color:var(--muted)}
.quote div{font-weight:700;font-size:15.5px;line-height:1.35}
.quote .key{background:linear-gradient(transparent 12%,var(--m) 12%,var(--m) 92%,transparent 92%)}
.mcard .btn+.btn{margin-top:10px}
.mcard .deco{position:absolute;right:0;top:0;width:110px;height:110px;pointer-events:none}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.pts{position:absolute;font-weight:900;font-size:22px;color:var(--ink);text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;animation:ptsUp .9s var(--out) forwards;white-space:nowrap}
@keyframes ptsUp{0%{opacity:0;transform:translate(-50%,0) scale(.5)}25%{opacity:1;transform:translate(-50%,-14px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-60px)}}
.runner{position:absolute;width:56px;height:56px;transition:transform 1s cubic-bezier(.5,0,.8,.3)}
.runner svg{width:100%;height:100%}
.runner .rc{position:absolute;right:-8px;top:-8px;width:26px;height:26px}
.flycoin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;transition:transform .55s cubic-bezier(.3,.7,.4,1)}
.flycoin svg{width:28px;height:28px;animation:coinSpin .5s linear infinite}
@keyframes coinSpin{50%{transform:scaleX(.15)}}
.heart{position:absolute;width:28px;height:28px;animation:heartUp 1.2s var(--out) forwards}
.heart svg{width:28px;height:28px}
@keyframes heartUp{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:translateY(-18px) scale(1.15)}100%{opacity:0;transform:translateY(-70px) scale(.8)}}
.conf{position:absolute;top:-30px;width:26px;height:26px;animation:fall var(--d) cubic-bezier(.25,.6,.45,1) forwards;animation-delay:var(--dl)}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

/* ---------- Старт ---------- */
.start{padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 18px)}
.start>*{position:relative;z-index:1}
.row{display:flex;justify-content:space-between;align-items:center}
.hero{flex:1;min-height:0;width:100%}
.ttl{font-weight:900;font-size:clamp(34px,10vw,46px);line-height:.98;letter-spacing:-.03em;margin:4px 0 0;position:relative}
.ttl .u{position:relative;display:inline-block;z-index:0}
.ttl .u svg{position:absolute;left:-6%;bottom:-6px;width:112%;height:24px;z-index:-1}
.lead{font-weight:700;font-size:17px;line-height:1.35;color:var(--ink2);margin:12px 0 16px}
.btn.big{min-height:68px;font-size:22px;border-radius:24px;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.btn.big:active{animation:none;transform:scale(.96)}

/* ---------- HUD ---------- */
.game{padding-top:var(--safe-t)}
.hud{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;position:relative;z-index:8}
.trail{flex:1;display:flex;justify-content:center;gap:8px}
.trail span{width:40px;height:40px;border-radius:14px;background:#E3E5EC;display:grid;place-items:center;font-size:21px;filter:grayscale(1);opacity:.55;transition:all .3s var(--out)}
.trail span.cur{background:#fff;box-shadow:var(--shadow);filter:none;opacity:1;transform:scale(1.12)}
.trail span.done{background:var(--m);filter:none;opacity:1}
.score{min-width:64px;height:46px;border-radius:15px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 12px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.score svg{width:18px;height:18px}
.score.bump{animation:bump .4s var(--spring)}
@keyframes bump{40%{transform:scale(1.18)}}
.field{position:relative;flex:1;min-height:0;overflow:hidden;z-index:2;touch-action:none;user-select:none;-webkit-user-select:none}
canvas.trailc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.ftag{position:absolute;z-index:9;background:var(--ink);color:#fff;font-weight:900;font-size:16px;padding:7px 12px;border-radius:14px;white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%);animation:ftag 1.5s var(--out) forwards}
.ftag.g{background:var(--green);color:var(--ink)}
.ftag.r{background:var(--red)}
.ftag.y{background:var(--yellow);color:var(--ink)}
@keyframes ftag{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-10deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(-3deg)}75%{opacity:1;transform:translate(-50%,-90%) scale(1)}100%{opacity:0;transform:translate(-50%,-120%) scale(.9)}}
.wbar{position:relative;z-index:6;margin:0 12px calc(var(--safe-b) + 10px);background:#fff;border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:66px}
.coins{display:flex;gap:3px;flex:1}
.coins svg{width:30px;height:30px;transition:all .35s var(--spring)}
.coins svg.gone{opacity:.18;filter:grayscale(1);transform:scale(.7)}
.wbar .wk{width:62px;height:62px;margin-top:-34px;flex:none}
.wbar .wk svg{width:100%;height:100%}
.hearts{display:flex;align-items:center;gap:4px;font-weight:900;font-size:19px;background:var(--soft);padding:6px 10px;border-radius:14px;font-variant-numeric:tabular-nums}
.hearts svg{width:24px;height:24px}
.hearts.wob,.coins.wob{animation:wob .5s}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

/* ---------- обучение: рука-подсказка ---------- */
.coach{position:absolute;inset:0;z-index:12;pointer-events:none}
.coach .cap{position:absolute;left:50%;top:calc(var(--safe-t) + 70px);transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;font-size:20px;padding:11px 18px;border-radius:18px;white-space:nowrap;animation:capIn .45s var(--spring) both;box-shadow:0 10px 24px rgba(0,0,0,.2)}
@keyframes capIn{from{opacity:0;transform:translateX(-50%) scale(.6)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.coach .cap.mid{top:42%}
.coach .cap.bottom{top:auto;bottom:calc(var(--safe-b) + 104px)}
.coach .ghand{position:absolute;left:0;top:0;font-size:52px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));margin:-8px 0 0 -18px}

/* ---------- сцена-оверлей ---------- */
.scene{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--safe-t) + 20px) 20px calc(var(--safe-b) + 20px);background:rgba(242,243,247,.97);opacity:0;pointer-events:none;transition:opacity .3s}
.scene.show{opacity:1;pointer-events:auto}
.scene .art{width:100%;max-width:340px;height:min(30vh,200px)}
.scene .art>svg{width:100%;height:100%}
.scene .kick{font-family:var(--hand);font-weight:700;font-size:25px;margin-top:6px}
.scene .big{font-weight:900;font-size:44px;line-height:.98;letter-spacing:-.03em;position:relative;z-index:0;margin:2px 0 14px}
.scene .big svg{position:absolute;left:-6%;bottom:-10px;width:112%;height:26px;z-index:-1}
.scene .btn{max-width:330px}
.legend{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-bottom:18px}
.lrow{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.rc{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border-radius:18px;padding:8px 6px 6px;min-width:62px;box-shadow:var(--shadow);font-weight:800;font-size:12px;animation:pop .45s var(--spring) both;animation-delay:calc(.15s + var(--i)*.07s)}
.rc b{font-size:30px;line-height:1;font-weight:400}
.rc svg{width:30px;height:30px}
.rc.bad{box-shadow:0 0 0 3px #FFB37A,var(--shadow)}
.rc.good{box-shadow:0 0 0 3px #7EE8A8,var(--shadow)}
.arrow{font-weight:900;font-size:16px;padding:0 2px;white-space:nowrap}
.picks{display:flex;gap:12px;justify-content:center;margin-bottom:18px}
.pk{width:92px;height:104px;border-radius:26px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:46px;animation:pop .45s var(--spring) both;animation-delay:calc(.15s + var(--i)*.08s);transition:transform .14s var(--out)}
.pk span{font-size:13px;font-weight:800}
.pk:active{transform:scale(.92)}
.stars3{display:flex;gap:8px;justify-content:center;margin:4px 0 14px}
.stars3 svg{width:58px;height:58px;animation:pop .5s var(--spring) both;animation-delay:calc(.5s + var(--i)*.22s)}
.stars3 svg path,.ms svg path{fill:var(--yellow);stroke:#111216;stroke-width:1.4;stroke-linejoin:round}
.stars3 svg.off path,.ms svg.off path{fill:#E3E5EC;stroke:#C9CCD8}
.bld{transition:fill 1.1s var(--out)}
.city .lit{animation:litPop .9s var(--spring) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes litPop{0%{transform:scale(1)}40%{transform:scale(1.08,.94)}100%{transform:scale(1)}}

/* ---------- Мир 1: пузыри ---------- */
.bub{position:absolute;left:0;top:0;width:150px;margin:-64px 0 0 -75px;background:#fff;border-radius:28px;padding:16px 10px 12px;box-shadow:0 12px 26px rgba(24,26,40,.14);text-align:center;will-change:transform;pointer-events:none;z-index:3}
.bub .bav{position:absolute;left:-12px;top:-14px;width:44px;height:44px}
.bub .bav svg{width:44px;height:44px}
.bub .bav.flip svg{animation:flip .55s var(--spring)}
@keyframes flip{from{transform:rotateY(90deg) scale(.5)}to{transform:none}}
.bub .bn{position:absolute;right:10px;top:-11px;background:var(--ink);color:#fff;font-weight:800;font-size:12px;padding:3px 9px;border-radius:9px;white-space:nowrap}
.bub .be{font-size:46px;line-height:1;display:block}
.bub .bt{font-weight:800;font-size:15px;line-height:1.15;display:block;margin-top:6px;position:relative;z-index:1}
.bub .splat{position:absolute;width:150px;height:150px;left:50%;top:50%;margin:-75px 0 0 -75px;pointer-events:none;mix-blend-mode:multiply;z-index:2}
.sp{transform-box:fill-box;transform-origin:center;animation:splat .32s var(--out) both}
@keyframes splat{from{transform:scale(.1)}to{transform:scale(1)}}
.drip{stroke-dasharray:1;stroke-dashoffset:1;animation:drawIn 1.2s ease-in .2s forwards}
.bub.hit .bn{background:var(--fox)}
.bub.out{transition:opacity .6s;opacity:0}
.bub.oops{animation:bShake .4s}
@keyframes bShake{0%,100%{margin-left:-75px}25%{margin-left:-83px}75%{margin-left:-67px}}
.bub.spot{box-shadow:0 0 0 5px var(--m),0 0 0 11px rgba(255,255,255,.7),0 12px 26px rgba(24,26,40,.14)}
.bub.spotg{box-shadow:0 0 0 5px var(--green),0 0 0 11px rgba(255,255,255,.7),0 12px 26px rgba(24,26,40,.14)}
.bub.boss{width:230px;margin:-90px 0 0 -115px;padding:22px 12px 14px;border-radius:36px;background:#FFF4EA}
.bub.boss .bav{width:64px;height:64px;left:-14px;top:-20px}
.bub.boss .bav svg{width:64px;height:64px}
.bub.boss .bi{display:flex;justify-content:center;gap:8px}
.bub.boss .bi span{font-size:44px;line-height:1;transition:transform .3s var(--spring),opacity .3s;display:inline-block}
.bub.boss .bi span.off{transform:scale(0) rotate(40deg);opacity:0}
.bub.boss .hpb{height:10px;border-radius:6px;background:#FFD9E8;margin:12px 8px 0;overflow:hidden}
.bub.boss .hpb i{display:block;height:100%;width:100%;background:var(--pink);transition:width .3s var(--out)}
.bub.boss.hitb{animation:bossHit .3s}
@keyframes bossHit{30%{filter:brightness(1.6);scale:1.06}}
.runner{position:absolute;width:56px;height:56px;transition:transform 1s cubic-bezier(.5,0,.8,.3)}
.runner svg{width:100%;height:100%}
.runner .rc2{position:absolute;right:-8px;top:-8px;width:26px;height:26px}

/* ---------- Мир 2: копилка ---------- */

function fresh(key, arr, n) {
  const r = SESSION.recent[key] || [], s = shuffle(arr);
  const out = [...s.filter(x => !r.includes(x)), ...s.filter(x => r.includes(x))].slice(0, n);
  SESSION.recent[key] = [...out, ...r.filter(x => !out.includes(x))].slice(0, Math.floor(arr.length * .7));

  if (S.i >= S.list.length) {
    const errs = S.wrong + S.unkind;
    return worldDone(2, errs <= 1 ? 3 : errs <= 4 ? 2 : 1, { emotionsRight: S.right, emotionsWrong: S.wrong, kindHelps: S.kind, unkindTries: S.unkind });
  }
  const s = S.cur = S.list[S.i];
  S.step = 'emo'; S.wrongHere = 0; S.seed = Math.random() * 99 | 0;
  field.innerHTML = `<div class="think"><b>${s.p}</b><span>${s.s}</span></div><div class="friend in" id="friend">${faceSVG('#D5D8E2', 'none', S.seed)}</div>`;
  $('#buckets').classList.remove('off');
  document.querySelectorAll('.bk').forEach(b => b.classList.remove('glow'));
  if (S.tut && S.i === 0) setTimeout(() => {
    if (ACTIVE !== S || S.step !== 'emo') return;
    const bk = document.querySelector(`.bk[data-e="${s.emo}"]`), fr = $('#friend');
    bk.classList.add('glow');
    const a = bk.getBoundingClientRect(), b = fr.getBoundingClientRect();
    coach('Тащи краску на друга! 🎨', [[a.left + 28, a.top + 20], [a.left + 28, a.top + 20], [b.left + b.width / 2, b.top + b.height / 2], [b.left + b.width / 2, b.top + b.height / 2]], 1700, 'bottom');
  }, 700);
}
function w3Drag(S, bk) {
  const k = bk.dataset.e, E = EMO[k];
  bk.addEventListener('pointerdown', e => {
    if (S.paused || S.step !== 'emo') return;
    e.preventDefault();
    const g = document.createElement('div'); g.className = 'dragc'; g.innerHTML = `${bucketSVG(E.c, 5)}<b>${E.e}</b>`;
    g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; document.body.appendChild(g);
    const x0 = e.clientX, y0 = e.clientY; let moved = false;
    Sound.tap();
    const mv = ev => { g.style.left = ev.clientX + 'px'; g.style.top = ev.clientY + 'px'; if (Math.hypot(ev.clientX - x0, ev.clientY - y0) > 12) moved = true; };
    const up = ev => {
      removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      const fr = $('#friend'); if (!fr) return g.remove();
      const r = fr.getBoundingClientRect();
      const over = ev.clientX > r.left - 20 && ev.clientX < r.right + 20 && ev.clientY > r.top - 20 && ev.clientY < r.bottom + 20;
      if (over) { g.remove(); w3Paint(S, k, ev.clientX, ev.clientY); return; }
      if (!moved) { // просто тап — краска летит в друга сама
        g.classList.add('fly'); const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        g.style.transform = `translate(${cx - ev.clientX}px,${cy - ev.clientY}px) scale(1.2)`;
        setTimeout(() => { g.remove(); w3Paint(S, k, cx, cy); }, 340); return;
      }
      g.remove();
    };
    addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
}
function w3Splash(field, x, y, color) {
  const fr = field.getBoundingClientRect(), d = document.createElement('div'); d.className = 'pblot';
  d.style.left = (x - fr.left) + 'px'; d.style.top = (y - fr.top) + 'px';
  d.innerHTML = splatSVG('style="width:100%;height:100%"').replace(/var\(--m\)/g, color);
  field.appendChild(d); setTimeout(() => { d.style.opacity = 0; setTimeout(() => d.remove(), 800); }, 500);
}
function w3Paint(S, k, x, y) {
  if (S.step !== 'emo' || ACTIVE !== S) return;
  const s = S.cur, E = EMO[k], field = $('#field'), fr = $('#friend');
  coachOff(); document.querySelectorAll('.bk').forEach(b => b.classList.remove('glow'));
  w3Splash(field, x, y, E.c); Sound.spray();
  if (k === s.emo) {
    S.step = 'help'; S.right++; S.got[k] = 1;
    fr.classList.remove('in', 'no'); fr.innerHTML = faceSVG(E.c, k, S.seed);
    setScore(10, fr); vibrate('light'); mood('happy');
    ftag(field, field.clientWidth / 2, fr.offsetTop - 10, `${E.e} ${E.t}!`, 'g');
    $('#buckets').classList.add('off');
    setTimeout(() => { if (ACTIVE === S) w3Helps(S); }, 650);
  } else {
    S.wrong++; S.wrongHere++;
    fr.classList.remove('in', 'no'); void fr.offsetWidth; fr.classList.add('no');
    fr.innerHTML = faceSVG(E.c, k, S.seed);
    setTimeout(() => { if (S.cur === s && S.step === 'emo') fr.innerHTML = faceSVG('#D5D8E2', 'none', S.seed); }, 700);
    Sound.bad(); vibrate('error'); mood('oops');
    ftag(field, field.clientWidth / 2, fr.offsetTop - 10, `Не ${E.t.toLowerCase()} 🙅`, 'r');
    if (S.wrongHere >= 2) document.querySelector(`.bk[data-e="${s.emo}"]`).classList.add('glow');
  }
}
function w3Helps(S) {
  const s = S.cur, field = $('#field');
  const opts = shuffle([{ e: s.good[0], t: s.good[1], ok: true }, ...BAD[s.emo].map(b => ({ e: b[0], t: b[1] }))]);
  const box = document.createElement('div'); box.className = 'helps'; box.id = 'helps';
  box.innerHTML = opts.map((o, i) => `<button class="hp" data-i="${i}" style="--i:${i}"><b>${o.e}</b>${o.t}</button>`).join('');
  field.appendChild(box);
  if (S.tut && S.i === 0) coach('Как помочь другу? 💛', null, 0, 'mid');
  let wrongs = 0;
  box.querySelectorAll('.hp').forEach(b => b.onclick = () => {
    if (S.paused || S.step !== 'help') return;
    const o = opts[+b.dataset.i], fr = $('#friend');
    coachOff();
    if (o.ok) {
      S.step = 'wait'; S.kind++;
      setScore(15, b); Sound.good(); vibrate('success'); mood('happy');
      fr.innerHTML = faceSVG(EMO.joy.c, 'joy', S.seed); fr.classList.add('yay');
      for (let i = 0; i < 4; i++) setTimeout(() => floatAt(fr, ICON.heart(pick(['#FF5CE6', '#FF3D6E', '#1FD16C'])), 'heart'), i * 140);
      box.remove();
      setTimeout(() => { if (ACTIVE !== S) return; fr.classList.remove('yay'); fr.classList.add('out'); field.querySelector('.think').remove(); }, 1100);
      setTimeout(() => { if (ACTIVE === S) w3Next(S); }, 1700);
    } else {
      S.unkind++; wrongs++; b.classList.add('no');
      fr.classList.remove('no'); void fr.offsetWidth; fr.classList.add('no');
      Sound.bad(); vibrate('error'); mood('sad');
      ftag(field, field.clientWidth / 2, fr.offsetTop - 10, 'Другу стало хуже 😢', 'r');
      if (wrongs >= 1) box.querySelectorAll('.hp').forEach((x, i) => { if (opts[i].ok) x.classList.add('glow'); });
    }
  });
}

/* ================= Финал ================= */
function renderFinal() {
  stopAll();
  const st = RUN.stars, total = sum(st, x => x);
  const title = total >= 8 ? 'Супергерой города!' : total >= 6 ? 'Город спасён!' : 'Цвета вернулись!';
  app.innerHTML = `<section class="screen result">${blobsBg()}
    <div class="row"><button class="ibtn" data-close aria-label="Закрыть">${ICON.x}</button>${soundBtn()}</div>
    <div class="r-hero" data-mood="happy"><svg viewBox="0 0 360 200">${cityArt(3).replace('<svg viewBox="0 0 360 200" class="city" aria-hidden="true">', '<g>').replace(/<\/svg>\s*$/, '</g>')}
      ${klyaksik({ can: true, attrs: 'x="132" y="112" width="90" height="90"' })}</svg></div>
    <div class="r-ttl">${title}</div>
    <p class="r-sub">Ты прогнал(а) Лиса и вернул(а) городу все краски!</p>
    <div class="total"><span>${ICON.star}<b data-count="${RUN.score}">0</b> очков</span></div>
    <div class="medals">${WORLDS.map((w, i) => `<div class="medal" style="--i:${i}"><div class="mi">${w.e}</div><div class="mt">${w.t}</div><div class="ms">${starRow(st[i])}</div></div>`).join('')}</div>
    <div class="h2">Правила героя</div>
    <div class="rules">
      <div class="rule"><span class="rn" style="--c:#2EC5FF">🔢</span>Коды и пароли — никому!</div>
      <div class="rule"><span class="rn" style="--c:#FFC400">🐷</span>Сначала копи, потом трать.</div>
      <div class="rule"><span class="rn" style="--c:#FF5CE6">💛</span>Пойми друга — и помоги.</div>
    </div>
    <div class="btns">
      <button class="btn big" id="again">Играть ещё раз 🔁</button>
      <div class="row2"><button class="btn dark" id="share">Поделиться</button><button class="btn soft" id="done">Готово</button></div>
    </div>
  </section>`;
  confetti(); Sound.win();
  setTimeout(() => app.querySelectorAll('[data-count]').forEach(countUp), 500);
  Bridge.send('complete', { score: RUN.score, stars: st, starsTotal: total, safety: RUN.m.safe, money: RUN.m.money, soft: RUN.m.soft });
  $('#again').onclick = () => { Sound.tap(); RUN = { score: 0, stars: [0, 0, 0], m: {} }; WORLDS[0].start(); };
  $('#share').onclick = () => {
    Sound.tap();
    const text = `Я спас(ла) город от Лиса-хулигана в игре «Кляксик спасает город» 🎨🦊\n${'⭐'.repeat(total)} · ${RUN.score} очков. Сможешь больше?`;
    Bridge.send('share', { text });
    if (!Bridge.native() && navigator.share) navigator.share({ text }).catch(() => {});
  };
  $('#done').onclick = () => { Sound.tap(); Bridge.send('finish', { score: RUN.score, stars: total }); };
}

/* ================= Глобальные обработчики ================= */
document.addEventListener('click', e => {
  if (e.target.closest('[data-sound]')) { Sound.toggle(); return; }
  if (e.target.closest('[data-close]')) { Bridge.send('close'); return; }
  if (e.target.closest('[data-pause]')) { Sound.tap(); pauseMenu(); }
});
document.addEventListener('keydown', e => { if (ACTIVE && ACTIVE.onKey && !ACTIVE.paused && !isModal()) ACTIVE.onKey(e); });

renderStart();
})();
</script>
