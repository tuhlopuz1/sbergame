<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F2F3F7">
<meta name="color-scheme" content="light">
<title>Кляксик против Лиса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Стиль по мотивам дизайн-системы СберKids «1dali»:
   белая «комната» + кислотные спреи, дудлы и блобы с глазками.
   ============================================================ */
:root{
  --bg:#F2F3F7;--card:#fff;--ink:#111216;--ink2:#2B2D35;--muted:#8B8FA0;--line:#E6E8EF;--soft:#EEF0F5;
  --lime:#C6F432;--green:#1FD16C;--cyan:#2EC5FF;--blue:#1A9BFF;--pink:#FF5CE6;--purple:#A77BFF;--yellow:#FFDD2E;--orange:#FF8A1F;--red:#FF3D6E;--fox:#FF7A1A;
  --m:#C6F432;
  --grad:linear-gradient(90deg,#27C4FF 0%,#35DE7B 55%,#C8F535 100%);
  --shadow:0 10px 30px rgba(24,26,40,.08),0 2px 6px rgba(24,26,40,.05);
  --font:"Onest","SB Sans Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Comic Sans MS",cursive;
  --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.23,1,.32,1);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--bg)}
body{font-family:var(--font);color:var(--ink);background:var(--bg);height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}
#app{height:100vh;height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
@media (min-width:560px){html,body{background:#E4E6EE}}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
svg{display:block;overflow:visible}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:screenIn .5s var(--out) both}
@keyframes screenIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

/* ---------- spray-фон ---------- */
.blobs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blobs i{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;animation:blobDrift 12s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:260px;height:260px;background:var(--lime);top:-60px;right:-70px}
.blobs i:nth-child(2){width:220px;height:220px;background:var(--pink);top:34%;left:-110px;animation-delay:-4s;opacity:.38}
.blobs i:nth-child(3){width:240px;height:240px;background:var(--cyan);bottom:-90px;right:-40px;animation-delay:-8s;opacity:.42}
@keyframes blobDrift{from{transform:translate(0,0) scale(1)}to{transform:translate(24px,30px) scale(1.12)}}

/* ---------- кнопки ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:14px 20px;border-radius:20px;
  background:var(--grad);color:var(--ink);font-weight:800;font-size:18px;letter-spacing:-.01em;width:100%;
  box-shadow:0 8px 22px rgba(46,197,255,.28),inset 0 -3px 0 rgba(0,0,0,.08);transition:transform .14s var(--out),filter .2s}
.btn:active{transform:scale(.96)}
.btn.dark{background:var(--ink);color:#fff;box-shadow:0 8px 20px rgba(17,18,22,.2)}
.btn.soft{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.ibtn{width:46px;height:46px;border-radius:15px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);flex:none;transition:transform .14s var(--out);color:var(--ink)}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:22px;height:22px}
.sound-btn .wv{opacity:0;transition:opacity .2s}
.sound-btn.on .wv{opacity:1;animation:wv 1.2s ease-in-out infinite}
.sound-btn.on .wv2{animation-delay:.2s}
.sound-btn.on .mute{opacity:0}
@keyframes wv{0%,100%{opacity:.35}50%{opacity:1}}
@media (hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.05)}.ibtn:hover{transform:translateY(-1px)}}

/* ---------- дудлы ---------- */
.draw path,.draw circle,path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawIn .9s var(--out) forwards;animation-delay:var(--d,0s)}
@keyframes drawIn{to{stroke-dashoffset:0}}
.wiggle{animation:wig 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
.twinkle{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1);opacity:1}}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}

/* ---------- Кляксик ---------- */
.klx .k-body{transform-box:fill-box;transform-origin:50% 100%;animation:kBob 2.2s ease-in-out infinite}
@keyframes kBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(.98,1.03)}}
.klx .k-eyes{transform-box:fill-box;transform-origin:center;animation:kBlink 4.2s infinite}
@keyframes kBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.klx .mo{opacity:0;transition:opacity .15s}
.klx .mo-smile{opacity:1}
[data-mood=happy] .klx .mo-smile,[data-mood=oops] .klx .mo-smile,[data-mood=sad] .klx .mo-smile{opacity:0}
[data-mood=happy] .klx .mo-happy{opacity:1}
[data-mood=oops] .klx .mo-oops{opacity:1}
[data-mood=sad] .klx .mo-sad{opacity:1}
[data-mood=happy] .klx .k-body{animation:kJump .5s var(--out) 3}
@keyframes kJump{0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.1,.88)}60%{transform:translateY(-16px) scale(.94,1.08)}}
[data-mood=oops] .klx .k-body{animation:kShake .4s linear 2}
@keyframes kShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
[data-mood=sad] .klx .k-pupils{transform:translateY(5px)}
.klx .k-drip{animation:kDrip 3.4s ease-in infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes kDrip{0%,30%{transform:scaleY(0);opacity:1}75%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1) translateY(10px);opacity:0}}
.spray-can{transform-box:fill-box;transform-origin:50% 100%;animation:canShake 1.4s ease-in-out infinite}
@keyframes canShake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(6deg)}}

/* ---------- Лис ---------- */
.fox .f-tail{transform-box:fill-box;transform-origin:0% 90%;animation:swish 1.5s ease-in-out infinite}
@keyframes swish{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.fox .f-lids{transition:transform .25s var(--out),opacity .2s}
.fox.caught .f-lids{transform:translateY(-12px);opacity:0}
.fox .f-mask{transform-box:fill-box;transform-origin:50% 50%}
.fox.cracking .f-mask{animation:jit .1s linear infinite}
@keyframes jit{0%,100%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}
.fox.unmasked .f-mask{animation:maskDrop .8s cubic-bezier(.55,0,.85,.4) forwards}
@keyframes maskDrop{to{transform:translate(40px,260px) rotate(80deg);opacity:0}}
.fox .f-leg{transform-box:fill-box;transform-origin:50% 0}
.fox.running .l1{animation:leg .15s linear infinite}
.fox.running .l2{animation:leg .15s linear infinite reverse}
@keyframes leg{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(35deg)}}
.fox .f-bang{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.fox.caught .f-bang{opacity:1;animation:pop .45s var(--spring) both}

/* ---------- Intro ---------- */
.intro{padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 16px)}
.intro>*{position:relative;z-index:1}
.row{display:flex;justify-content:space-between;align-items:center}
.hero{flex:1;min-height:0;width:100%}
.ttl{font-weight:900;font-size:clamp(34px,10vw,46px);line-height:.98;letter-spacing:-.03em;margin:4px 0 0;position:relative}
.ttl .u{position:relative;display:inline-block;z-index:0}
.ttl .u svg{position:absolute;left:-6%;bottom:-6px;width:112%;height:24px;z-index:-1}
.lead{font-weight:600;font-size:16.5px;line-height:1.35;color:var(--ink2);margin:12px 0 14px;max-width:360px}
.hand{font-family:var(--hand);font-weight:700;font-size:24px;line-height:1;color:var(--ink)}
.pick{display:flex;align-items:center;gap:6px;background:#fff;border-radius:20px;padding:8px 10px 8px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.pick .hand{font-size:21px;flex:1}
.sw{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;transition:transform .2s var(--spring),background .2s}
.sw svg{width:40px;height:40px}
.sw.on{background:var(--soft);transform:scale(1.12)}
.sw:active{transform:scale(.9)}
.best{text-align:center;font-weight:700;font-size:14px;color:var(--muted);margin-top:10px}

/* ---------- HUD / поле ---------- */
.game{padding-top:var(--safe-t)}
.hud{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;position:relative;z-index:8}
.waves{flex:1;display:flex;gap:6px}
.waves i{flex:1;height:8px;border-radius:9px;background:#DCDFE8;overflow:hidden;position:relative}
.waves i.boss{flex:.6;background:#F3D9EF}
.waves i b{position:absolute;inset:0;width:0;background:var(--green);border-radius:9px;transition:width .5s var(--out)}
.waves i.boss b{background:var(--pink)}
.score{min-width:64px;height:46px;border-radius:15px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 12px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.score svg{width:18px;height:18px}
.score.bump{animation:bump .4s var(--spring)}
@keyframes bump{40%{transform:scale(1.18)}}

.field{position:relative;flex:1;min-height:0;overflow:hidden;z-index:2}
.field .dim{position:absolute;inset:0;background:rgba(17,18,22,.32);opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}
.field .dim.show{opacity:1}
.combo{position:absolute;right:14px;top:6px;z-index:6;pointer-events:none;opacity:0;transform:scale(.4) rotate(-12deg);transition:opacity .2s,transform .35s var(--spring)}
.combo.show{opacity:1;transform:rotate(-8deg)}
.combo svg{width:100px;height:56px}

.msg{position:absolute;left:0;top:0;width:min(330px,calc(100% - 24px));background:#fff;border-radius:22px;padding:11px 13px 12px;box-shadow:var(--shadow);cursor:pointer;will-change:transform;z-index:3;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.msg-in{transition:transform .14s var(--out)}
.msg:active .msg-in{transform:scale(.97)}
.msg-top{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.msg-av{width:38px;height:38px;flex:none}
.msg-av svg{width:38px;height:38px}
.msg-av.flip svg{animation:flip .55s var(--spring)}
@keyframes flip{from{transform:rotateY(90deg) scale(.5)}to{transform:none}}
.msg-meta{display:flex;flex-direction:column;min-width:0}
.msg-meta b{font-weight:800;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-meta b s{color:var(--muted);text-decoration-thickness:2.5px;text-decoration-color:var(--red);margin-right:5px}
.msg-meta b em{font-style:normal;color:var(--fox)}
.msg-meta span{font-weight:600;font-size:12.5px;color:var(--muted)}
.msg-meta span.warn{color:var(--orange)}
.msg-text{font-weight:700;font-size:17px;line-height:1.32;color:var(--ink);position:relative;z-index:1}
.msg .key{border-radius:6px;transition:background .25s}
.msg.hit .key{background:linear-gradient(transparent 12%,var(--m) 12%,var(--m) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.msg .splat{position:absolute;width:150px;height:150px;left:50%;top:50%;margin:-75px 0 0 -75px;pointer-events:none;mix-blend-mode:multiply;z-index:2}
.sp{transform-box:fill-box;transform-origin:center;animation:splat .32s var(--out) both}
@keyframes splat{from{transform:scale(.1)}to{transform:scale(1)}}
.drip{stroke-dasharray:1;stroke-dashoffset:1;animation:drawIn 1.2s ease-in .2s forwards}
.tag{position:absolute;right:-6px;top:-14px;background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:6px 10px;border-radius:12px;transform:rotate(4deg);z-index:4;animation:tagIn .45s var(--spring) both;white-space:nowrap}
@keyframes tagIn{from{transform:rotate(-14deg) scale(0)}to{transform:rotate(4deg) scale(1)}}
.msg.gone{transition:transform .5s cubic-bezier(.55,0,.85,.4),opacity .5s;opacity:0}
.msg.oops{animation:msgShake .4s}
@keyframes msgShake{0%,100%{margin-left:0}25%{margin-left:-6px}75%{margin-left:6px}}
.msg.spot{z-index:7;animation:spot 1.1s ease-in-out infinite}
@keyframes spot{0%,100%{box-shadow:0 0 0 4px var(--m),0 0 0 9px rgba(255,255,255,.7),var(--shadow)}50%{box-shadow:0 0 0 7px var(--m),0 0 0 14px rgba(255,255,255,.5),var(--shadow)}}
.msg.delivered{transition:transform .45s var(--out),opacity .45s;opacity:0}

/* dock */
.dock{position:relative;z-index:6;margin:0 12px calc(var(--safe-b) + 10px);background:#fff;border-radius:26px;box-shadow:0 -6px 24px rgba(24,26,40,.06),var(--shadow);display:flex;align-items:center;gap:8px;padding:8px 12px 8px 6px;min-height:76px}
.dock-m{width:64px;height:64px;flex:none;margin-top:-26px}
.dock-m svg{width:100%;height:100%}
.dock-say{flex:1;font-weight:700;font-size:14px;line-height:1.25;min-width:0}
.dock-say .in{display:block;animation:sayIn .3s var(--out) both}
@keyframes sayIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-size:17px;padding:6px 9px;border-radius:14px;background:var(--soft);font-variant-numeric:tabular-nums}
.stat svg{width:22px;height:22px}
.stat.pig svg{width:38px;height:30px}
.stat.wob{animation:wob .5s}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}

/* tip */
.tip{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 96px);z-index:9;background:#fff;border-radius:24px;padding:14px 14px 14px 10px;box-shadow:0 16px 40px rgba(17,18,22,.22);display:flex;gap:8px;align-items:flex-start;transform:translateY(30px) scale(.95);opacity:0;pointer-events:none;transition:transform .4s var(--spring),opacity .25s}
.tip.show{transform:none;opacity:1;pointer-events:auto}
.tip .tm{width:58px;height:58px;flex:none}
.tip h4{font-weight:900;font-size:18px;line-height:1.15;margin:6px 0 3px}
.tip p{font-weight:600;font-size:15px;line-height:1.35;color:var(--ink2)}
.tip .btn{min-height:46px;font-size:16px;margin-top:10px;border-radius:15px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--ink);color:#fff;font-weight:800;font-size:13.5px;padding:5px 10px;border-radius:11px}
.chip.m{background:var(--m);color:var(--ink)}

/* модалка */
.modal{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(var(--safe-b) + 12px);background:rgba(17,18,22,.38);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.show{opacity:1;pointer-events:auto}
.mcard{width:100%;background:#fff;border-radius:30px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);transform:translateY(40px);transition:transform .45s var(--spring);position:relative;max-height:92%;overflow-y:auto}
.modal.show .mcard{transform:none}
.mcard .mh{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:relative;z-index:1}
.mcard .mh .mm{width:70px;height:70px;flex:none}
.mcard h3{font-weight:900;font-size:23px;line-height:1.1;letter-spacing:-.02em}
.mcard p{font-weight:600;font-size:16px;line-height:1.4;color:var(--ink2);margin:10px 0 14px}
.quote{background:var(--soft);border-radius:18px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start}
.quote svg{width:34px;height:34px;flex:none}
.quote b{display:block;font-size:13.5px;font-weight:800;color:var(--muted)}
.quote div{font-weight:700;font-size:15.5px;line-height:1.35}
.quote .key{background:linear-gradient(transparent 12%,var(--m) 12%,var(--m) 92%,transparent 92%)}
.mcard .btn+.btn{margin-top:10px}
.mcard .deco{position:absolute;right:0;top:0;width:110px;height:110px;pointer-events:none}

/* интро волны */
.wave-in{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(242,243,247,.95);opacity:0;pointer-events:none;transition:opacity .3s}
.wave-in.show{opacity:1;pointer-events:auto}
.wave-in .big{font-weight:900;font-size:60px;line-height:.95;letter-spacing:-.04em;position:relative;z-index:0}
.wave-in .big svg{position:absolute;left:-8%;bottom:-12px;width:116%;height:30px;z-index:-1}
.wave-in .hand{font-size:28px;margin:18px 0 12px}
.wave-in .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px;max-width:340px}
.wave-in .chips .chip{font-size:15px;padding:8px 12px;border-radius:14px;animation:pop .45s var(--spring) both;animation-delay:calc(.3s + var(--i)*.1s)}
.wave-in .btn{max-width:320px}
.wave-in .wk{width:120px;height:120px;margin-bottom:6px}
.count{position:absolute;inset:0;z-index:16;display:grid;place-items:center;pointer-events:none}
.count span{font-weight:900;font-size:130px;line-height:1;animation:cnt .7s var(--out) both;position:relative;z-index:0}
.count svg{position:absolute;width:220px;height:220px;left:50%;top:50%;margin:-110px 0 0 -110px;z-index:-1}
@keyframes cnt{0%{transform:scale(2.2);opacity:0}30%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.7);opacity:0}}

/* ---------- Босс ---------- */
.bossv{position:absolute;left:0;right:0;bottom:0;top:calc(var(--safe-t) + 62px);z-index:7;display:flex;flex-direction:column;padding:0 14px calc(var(--safe-b) + 12px);background:var(--bg);animation:screenIn .5s var(--out) both}
.bossv .arena{position:relative;height:clamp(150px,27vh,220px);flex:none;display:flex;flex-direction:column;align-items:center}
.bossv .bfox{height:calc(100% - 34px);aspect-ratio:160/170;transition:transform .9s cubic-bezier(.55,0,.75,.2)}
.bossv .bfox.hit{animation:hit .35s}
@keyframes hit{0%{transform:translateX(0);filter:brightness(1)}20%{transform:translateX(-10px) rotate(-6deg);filter:brightness(2.2)}50%{transform:translateX(8px) rotate(4deg)}100%{transform:none;filter:brightness(1)}}
.bossv .bfox.gone{transform:translate(70vw,-50vh) rotate(540deg) scale(.2)}
.bossv .bfox svg{width:100%;height:100%}
.hp{display:flex;gap:5px;align-items:center;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:var(--shadow);font-weight:800;font-size:13px}
.hp i{width:30px;height:10px;border-radius:6px;background:var(--pink);transition:transform .3s var(--spring),background .3s}
.hp i.off{background:var(--line);transform:scaleY(.6)}
.bossv .bchat{position:relative;flex:1;min-height:0;background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:12px 14px;overflow-y:auto;overscroll-behavior:contain;margin-top:8px}
.bossv .bchat .msg-top{margin-bottom:10px}
.bossv .btext{font-weight:700;font-size:18.5px;line-height:1.55}
.ch{border-radius:7px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .25s,color .25s}
.ch.lnk{color:var(--blue);text-decoration:underline;word-break:break-all}
.bsplat{position:absolute;width:84px;height:84px;pointer-events:none;mix-blend-mode:multiply;opacity:.9;z-index:0}
.btext{position:relative;z-index:1}
.ch.hitc{background:linear-gradient(transparent 8%,var(--m) 8%,var(--m) 94%,transparent 94%)}
.ch.miss{color:#B9BCC8}
.ch.hint{animation:hintG 1s ease-in-out infinite}
@keyframes hintG{0%,100%{background:rgba(255,221,46,.35)}50%{background:rgba(255,221,46,.9)}}
.bossv .bbar{display:flex;gap:10px;align-items:center;margin-top:10px}
.bossv .bbar .bm{width:58px;height:58px;flex:none}
.bossv .bbar .dock-say{background:#fff;border-radius:18px;padding:9px 12px;box-shadow:var(--shadow);min-height:52px;display:flex;align-items:center}
.bossv .bbar .ibtn svg{width:26px;height:26px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:20px;background:var(--soft);font-weight:700;font-size:16px;line-height:1.3;transition:transform .12s var(--out),opacity .2s;animation:pop .4s var(--spring) both;animation-delay:calc(var(--i)*.07s)}
.opt:active{transform:scale(.97)}
.opt .oi{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#fff}
.opt.no{opacity:.4;text-decoration:line-through;pointer-events:none}
.victory{position:absolute;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none}
.victory .vt{font-weight:900;font-size:58px;letter-spacing:-.04em;transform:rotate(-6deg);animation:vIn .6s var(--spring) both;position:relative;z-index:0}
.victory svg{position:absolute;left:-12%;top:-30%;width:124%;height:160%;z-index:-1}
@keyframes vIn{from{transform:rotate(-30deg) scale(0)}to{transform:rotate(-6deg) scale(1)}}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.pts{position:absolute;font-weight:900;font-size:22px;color:var(--ink);text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;animation:ptsUp .9s var(--out) forwards;white-space:nowrap}
@keyframes ptsUp{0%{opacity:0;transform:translate(-50%,0) scale(.5)}25%{opacity:1;transform:translate(-50%,-14px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-60px)}}
.runner{position:absolute;width:56px;height:56px;transition:transform 1s cubic-bezier(.5,0,.8,.3)}
.runner svg{width:100%;height:100%}
.runner .rc{position:absolute;right:-8px;top:-8px;width:26px;height:26px}
.flycoin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;transition:transform .55s cubic-bezier(.3,.7,.4,1)}
.flycoin svg{width:28px;height:28px;animation:coinSpin .5s linear infinite}
@keyframes coinSpin{50%{transform:scaleX(.15)}}
.heart{position:absolute;width:28px;height:28px;animation:heartUp 1.2s var(--out) forwards}
.heart svg{width:28px;height:28px}
@keyframes heartUp{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:translateY(-18px) scale(1.15)}100%{opacity:0;transform:translateY(-70px) scale(.8)}}
.conf{position:absolute;top:-30px;width:26px;height:26px;animation:fall var(--d) cubic-bezier(.25,.6,.45,1) forwards;animation-delay:var(--dl)}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

/* ---------- Результат ---------- */
.result{overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 20px)}
.result>*{position:relative;z-index:1}
.r-hero{position:relative;height:200px;margin:4px 0}
.r-hero>svg{width:100%;height:100%}
.r-ttl{font-weight:900;font-size:38px;line-height:1;letter-spacing:-.03em}
.r-sub{font-weight:600;color:var(--ink2);margin:10px 0 16px;line-height:1.35;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.sc{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:pop .5s var(--spring) both;animation-delay:calc(.5s + var(--i)*.08s)}
.sc .v{font-weight:900;font-size:30px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.sc .v small{font-size:18px;color:var(--muted);font-weight:800}
.sc .v svg{width:30px;height:30px}
.sc .l{font-weight:600;font-size:13.5px;color:var(--muted);margin-top:2px;position:relative;z-index:1}
.sc .bl{position:absolute;right:-18px;bottom:-18px;width:64px;height:64px;border-radius:50%;opacity:.5;filter:blur(2px)}
.h2{font-weight:900;font-size:22px;letter-spacing:-.02em;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.tc{background:#fff;border-radius:20px;padding:14px 6px 10px;text-align:center;box-shadow:var(--shadow);position:relative;animation:pop .45s var(--spring) both;animation-delay:calc(.8s + var(--i)*.05s)}
.tc .ci{font-size:30px;line-height:1}
.tc .ct{font-weight:800;font-size:12.5px;line-height:1.15;margin-top:5px}
.tc .st{position:absolute;top:-8px;right:-4px;font-size:11px;font-weight:800;padding:3px 7px;border-radius:9px;background:var(--m);color:var(--ink);transform:rotate(6deg)}
.tc.miss .st{background:var(--yellow)}
.tc.none{opacity:.45}
.tc.none .st{background:var(--line)}
.rules{background:var(--ink);color:#fff;border-radius:26px;padding:16px;margin-bottom:20px;display:flex;flex-direction:column;gap:12px}
.rule{display:flex;gap:12px;align-items:center;font-weight:700;font-size:15.5px;line-height:1.3}
.rule .rn{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--ink);font-weight:900;background:var(--c)}
.btns{display:flex;flex-direction:column;gap:10px}

/* ---------- Карта уровней ---------- */
.hub{overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 24px)}
.hub>*{position:relative;z-index:1}
.hub-hero{height:168px;margin:0 0 2px;flex:none}
.hub-hero svg{width:100%;height:100%}
.hub .ttl{font-size:clamp(34px,10vw,44px)}
.hub .lead{margin:10px 0 12px}
.starpill{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;font-weight:800;font-size:16px;padding:8px 14px;border-radius:14px;font-variant-numeric:tabular-nums}
.starpill svg{width:20px;height:20px}
.dom{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.dom .de{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--c);flex:none}
.dom h2{font-weight:900;font-size:21px;letter-spacing:-.02em;line-height:1.1}
.dom span{font-weight:600;font-size:13px;color:var(--muted);display:block;margin-top:2px}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lvl{background:#fff;border-radius:24px;padding:12px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;animation:pop .45s var(--spring) both;animation-delay:calc(var(--i)*.05s);transition:transform .14s var(--out)}
.lvl:active{transform:scale(.96)}
.lvl .la{width:62px;height:62px;display:grid;place-items:center;font-size:34px;position:relative}
.lvl .la svg{position:absolute;inset:0;width:100%;height:100%}
.lvl .la b{position:relative;font-weight:400}
.lvl .lt{font-weight:900;font-size:16px;line-height:1.12}
.lvl .ld{font-weight:600;font-size:12.5px;line-height:1.25;color:var(--muted)}
.lvl .ls{display:flex;gap:2px;margin-top:auto;padding-top:4px}
.lvl .ls svg{width:20px;height:20px}
.lvl .new{position:absolute;right:10px;top:10px;background:var(--m);font-weight:900;font-size:11px;padding:4px 8px;border-radius:9px;transform:rotate(6deg)}
.ls svg path,.stars3 svg path{fill:var(--m);stroke:#111216;stroke-width:1.4;stroke-linejoin:round}
.ls svg.off path,.stars3 svg.off path{fill:#E3E5EC;stroke:#C9CCD8}
.stars3{display:flex;gap:8px;justify-content:center;margin:0 0 10px}
.stars3 svg{width:54px;height:54px;animation:pop .5s var(--spring) both;animation-delay:calc(.35s + var(--i)*.18s)}
.stars3 svg:nth-child(2){transform:translateY(-10px);animation-name:pop2}
@keyframes pop2{from{transform:translateY(-10px) scale(0) rotate(-20deg)}to{transform:translateY(-10px)}}
.row2{display:flex;gap:10px}
.newrec{text-align:center;font-family:var(--hand);font-size:24px;margin:-8px 0 12px}

/* ---------- общий HUD режимов ---------- */
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.hud-t{font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn.q{font-weight:900;font-size:21px}
.how{display:flex;flex-direction:column;gap:10px;margin:8px 0 16px}
.how .rule .rn{background:var(--soft);font-size:20px}
.choice{display:flex;gap:10px;padding:8px 14px 10px;position:relative;z-index:3}
.choice .btn{flex:1;min-height:54px}
.btn.no{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.minichip{display:inline-flex;align-items:center;gap:4px;background:#fff;box-shadow:var(--shadow);font-weight:800;font-size:13px;padding:5px 10px;border-radius:11px;animation:pop .35s var(--spring) both}
.lessons{background:var(--ink);color:#fff;border-radius:26px;padding:16px;margin-bottom:20px;display:flex;flex-direction:column;gap:12px}
.lessons .rule .rn{font-size:19px}
.mlist{display:flex;flex-direction:column;gap:8px;margin:10px 0 14px}
.mlist div{background:var(--soft);border-radius:16px;padding:9px 12px;font-weight:700;font-size:15px;line-height:1.35}
.mlist div b{font-weight:900}

/* ---------- Копилка мечты ---------- */
.pg-top{margin:4px 14px 0;background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:10px 12px;display:flex;align-items:center;gap:10px;position:relative;z-index:3}
.pg-dream{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:30px;flex:none}
.pg-info{flex:1;min-width:0}
.pg-info b{font-weight:900;font-size:15px}
.pbar{height:12px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:6px;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--grad);border-radius:9px;transition:width .5s var(--out)}
.pg-nums{display:flex;justify-content:space-between;font-weight:700;font-size:12.5px;color:var(--muted);margin-top:4px}
.wallet{display:flex;align-items:center;gap:4px;font-weight:900;font-size:20px;background:var(--soft);padding:6px 10px;border-radius:14px;font-variant-numeric:tabular-nums;flex:none}
.wallet svg{width:24px;height:24px}
.wallet.wob{animation:wob .5s}
.pg-chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 14px 0;min-height:28px;position:relative;z-index:3}
.deck{flex:1;min-height:0;position:relative;z-index:2}
.card{position:absolute;left:50%;top:50%;width:min(300px,80%);height:min(330px,94%);margin:0;translate:-50% -50%;background:#fff;border-radius:30px;box-shadow:0 18px 40px rgba(24,26,40,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform;animation:cardIn .4s var(--spring) both}
@keyframes cardIn{from{scale:.85;opacity:0}to{scale:1;opacity:1}}
.card.back{transform:scale(.92) translateY(20px);opacity:.55;pointer-events:none;animation:none}
.card .ce{font-size:80px;line-height:1}
.card h3{font-weight:900;font-size:22px;line-height:1.12;margin-top:12px;letter-spacing:-.02em}
.card p{font-weight:600;font-size:15px;line-height:1.35;color:var(--ink2);margin-top:6px}
.card .price{margin-top:12px;font-weight:900;font-size:24px;display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:16px;background:#FFE9EE;color:#C2184B}
.card .price.plus{background:#DDF8E8;color:#0E8A45}
.card .price svg{width:26px;height:26px}
.card .stamp{position:absolute;top:20px;font-weight:900;font-size:22px;padding:4px 12px;border:4px solid;border-radius:14px;opacity:0;pointer-events:none}
.card .stamp.yes{left:16px;color:var(--green);transform:rotate(-14deg)}
.card .stamp.no{right:16px;color:var(--red);transform:rotate(14deg)}
.card.fly{transition:transform .4s var(--out),opacity .4s}
.card.shake{animation:cardShake .4s}
@keyframes cardShake{0%,100%{margin-left:0}25%{margin-left:-10px}75%{margin-left:10px}}
.flyc{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;transition:transform .6s cubic-bezier(.3,.7,.4,1),opacity .6s}
.flyc svg{width:28px;height:28px;animation:coinSpin .5s linear infinite}

/* ---------- Хватит ли денег ---------- */
.ct-top{display:flex;gap:10px;margin:4px 14px 0;position:relative;z-index:3}
.slist{flex:1;min-width:0;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:9px 12px}
.slist .hand{font-size:20px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slist ul{list-style:none;display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.slist li{display:flex;align-items:center;gap:3px;font-weight:800;font-size:13.5px;padding:4px 8px;border-radius:10px;background:var(--soft);transition:background .2s}
.slist li.ok{background:#DDF8E8;color:#0E8A45}
.slist.oops{animation:cardShake .4s}
.budget{width:104px;flex:none;background:var(--ink);color:#fff;border-radius:22px;padding:9px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.budget small{font-weight:700;font-size:11.5px;opacity:.7}
.budget b{font-weight:900;font-size:21px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.budget b svg{width:20px;height:20px}
.budget .left.over{color:#FF8FAB}
.belt{flex:1;min-height:0;position:relative;overflow:hidden;z-index:2}
.belt .track{position:absolute;left:0;right:0;top:50%;height:120px;margin-top:-30px;background:repeating-linear-gradient(90deg,#2B2D35 0 22px,#3A3D4A 22px 44px);border-radius:18px;box-shadow:inset 0 6px 0 rgba(255,255,255,.08),inset 0 -6px 0 rgba(0,0,0,.25)}
.belt .track.run{animation:beltRun 1s linear infinite}
@keyframes beltRun{to{background-position:-44px 0}}
.prod{position:absolute;left:0;top:50%;margin-top:-66px;width:96px;height:124px;background:#fff;border-radius:20px;box-shadow:0 8px 18px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;touch-action:manipulation;will-change:transform;user-select:none;-webkit-user-select:none}
.prod .pe{font-size:42px;line-height:1}
.prod .pn{font-weight:800;font-size:12.5px;line-height:1.1;text-align:center;padding:0 4px}
.prod .pp{font-weight:900;font-size:16px;display:flex;align-items:center;gap:3px}
.prod .pp svg{width:16px;height:16px}
.prod .fancy{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-4deg);background:var(--pink);color:#fff;font-weight:800;font-size:10.5px;padding:3px 7px;border-radius:8px;white-space:nowrap}
.cartbar{margin:0 12px 8px;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:8px 10px;display:flex;align-items:center;gap:8px;min-height:62px;position:relative;z-index:3}
.cartbar .cic{font-size:28px;flex:none}
.incart{flex:1;display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none}
.incart::-webkit-scrollbar{display:none}
.incart button{flex:none;display:flex;flex-direction:column;align-items:center;background:var(--soft);border-radius:14px;padding:4px 8px;font-size:22px;line-height:1;animation:pop .35s var(--spring)}
.incart button small{font-size:11px;font-weight:800;margin-top:2px}
.incart button.warn{background:#FFE3EA;box-shadow:0 0 0 2px var(--red)}
.incart .empty{font-weight:700;font-size:13px;color:var(--muted)}
.dock .btn.pay{width:auto;min-height:50px;padding:10px 16px;font-size:16px;border-radius:16px;flex:none}

/* ---------- Ловец эмоций ---------- */
.emo-top{margin:4px 14px 0;background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:12px;align-items:center;position:relative;z-index:4;min-height:86px}
.emo-av{width:60px;height:60px;flex:none;position:relative}
.emo-av>svg{width:100%;height:100%}
.emo-av .face{position:absolute;right:-8px;bottom:-6px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:21px;font-weight:900;box-shadow:var(--shadow)}
.emo-av .face.pop{animation:pop .45s var(--spring)}
.emo-txt{min-width:0}
.emo-txt b{display:block;font-weight:800;font-size:13px;color:var(--muted)}
.emo-txt div{font-weight:800;font-size:16.5px;line-height:1.25}
.emo-q{font-family:var(--hand);font-size:23px;text-align:center;margin:6px 12px 0;position:relative;z-index:3;line-height:1.05}
.efield{position:relative;flex:1;min-height:0;overflow:hidden;z-index:2;touch-action:none}
.drop{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.drop.e{width:86px;height:86px;margin-left:-43px}
.drop.e svg{position:absolute;inset:0;width:100%;height:100%}
.drop.e .dfe{position:absolute;inset:0;display:grid;place-items:center;font-size:36px;padding-bottom:10px}
.drop.e .dl{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:12px;padding:3px 8px;border-radius:9px;white-space:nowrap}
.drop.p{width:170px;margin-left:-85px;background:#fff;border-radius:18px;padding:9px 12px;font-weight:800;font-size:14.5px;line-height:1.25;box-shadow:var(--shadow);text-align:center}
.drop.p::before{content:"💬";position:absolute;left:-8px;top:-10px;font-size:18px}
.drop.glow{filter:drop-shadow(0 0 10px var(--yellow)) drop-shadow(0 0 4px var(--yellow))}
.drop.got{transition:opacity .3s,scale .3s;opacity:0;scale:.4}
.drop.bad{transition:opacity .4s,translate .4s;opacity:0;translate:0 40px}
.catcher{position:absolute;left:0;bottom:0;width:104px;height:104px;margin-left:-52px;will-change:transform;pointer-events:none;z-index:4}
.catcher .klx{width:100%;height:100%}
.catcher .net{position:absolute;left:-6px;right:-6px;top:6px;height:30px}
.drag-hint{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);font-family:var(--hand);font-size:22px;white-space:nowrap;pointer-events:none;z-index:4;animation:hintB 1.4s ease-in-out infinite}
@keyframes hintB{0%,100%{translate:-14px 0}50%{translate:14px 0}}

/* ---------- Успей вовремя ---------- */
.tm-top{margin:4px 14px 0;background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:12px;position:relative;z-index:3}
.tm-h{display:flex;align-items:center;gap:10px}
.tm-h .te{font-size:34px;flex:none}
.tm-h b{font-weight:900;font-size:18px;line-height:1.1;display:block}
.tm-h span{display:block;font-weight:600;font-size:13.5px;color:var(--ink2);margin-top:2px;line-height:1.3}
.tl{margin-top:10px;height:44px;border-radius:14px;background:var(--soft);position:relative;overflow:hidden}
.tl .seg{position:absolute;top:0;bottom:0;display:grid;place-items:center;font-size:19px;border-right:2px solid #fff;background:var(--c);transition:left .3s var(--out),width .3s var(--out);overflow:hidden}
.tl .lim{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--red);z-index:2;transition:left .3s var(--out)}
.tl .lim::after{content:"🚌";position:absolute;top:50%;right:6px;transform:translateY(-50%);font-size:16px}
.tl.over .seg.out{background:repeating-linear-gradient(45deg,#FFB3C4 0 6px,#FFD6DF 6px 12px)}
.tl-n{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin-top:6px;color:var(--ink2)}
.tl-n .over{color:var(--red)}
.tasks{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px 14px;align-content:start;position:relative;z-index:2}
.task{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:10px;display:flex;align-items:center;gap:8px;text-align:left;transition:transform .14s var(--out),background .2s,color .2s;animation:pop .4s var(--spring) both;animation-delay:calc(var(--i)*.04s);min-height:62px}
.task:active{transform:scale(.95)}
.task .te{font-size:27px;flex:none}
.task b{font-weight:800;font-size:13.5px;line-height:1.15;display:block}
.task small{font-weight:800;font-size:12.5px;color:var(--muted)}
.task.on{background:var(--ink);color:#fff}
.task.on small{color:var(--m)}
.sim{display:flex;flex-direction:column;align-items:center;gap:6px}
.sim .clock{width:150px;height:150px}
.sim .now{font-weight:900;font-size:26px;min-height:34px}
.sim .mins{font-weight:800;font-size:16px;color:var(--muted)}

/* ---------- Фонарик ---------- */
.room{flex:1;min-height:0;position:relative;margin:4px 12px 0;border-radius:26px;overflow:hidden;touch-action:none;z-index:2;box-shadow:var(--shadow)}
.room .rbg{position:absolute;inset:0;width:100%;height:100%}
.room .obj{position:absolute;width:70px;height:74px;margin:-37px 0 0 -35px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border-radius:22px;transition:background .2s}
.room .obj .oe{font-size:40px;line-height:1}
.room .obj .on{font-weight:800;font-size:11px;line-height:1.05;margin-top:3px;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:7px;white-space:nowrap}
.room .obj .ring{position:absolute;inset:-10px;opacity:0}
.room .obj.found .ring{opacity:1}
.room .obj.found{background:rgba(255,61,110,.12)}

.found-strip{display:flex;gap:6px;margin:8px 14px 8px;justify-content:center;position:relative;z-index:3}
.found-strip span{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:23px;animation:pop .4s var(--spring)}
.found-strip span.empty{background:transparent;box-shadow:none;border:2.5px dashed #C9CCD8;animation:none}

}

  .blobs i,.klx .k-body,.twinkle,.wiggle,.spray-can,.fox .f-tail{animation:none!important}
}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="spray" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
  </defs>

<div id="app"></div>
<div id="fx" aria-hidden="true"></div>
<script>
(() => {
'use strict';

/* =========================================================
   Мост «страница → приложение»: пять событий контракта.
   Имена — в одном месте, сверить со страницей «Ограничения».
   ========================================================= */
const EVENTS = { close: 'close', finish: 'finish', vibrate: 'vibrate', share: 'share', complete: 'complete' };
const Bridge = {
  native() { return !!(window.ReactNativeWebView || (window.webkit && window.webkit.messageHandlers) || window.AndroidBridge || window.parent !== window); },
  send(type, payload = {}) {
    const msg = { type: EVENTS[type] || type, payload }, json = JSON.stringify(msg);
    try { window.ReactNativeWebView && window.ReactNativeWebView.postMessage(json); } catch (e) {}
    try { const h = window.webkit && window.webkit.messageHandlers; h && (h.app || h.bridge) && (h.app || h.bridge).postMessage(msg); } catch (e) {}
    try { window.AndroidBridge && window.AndroidBridge.postMessage && window.AndroidBridge.postMessage(json); } catch (e) {}
    try { window.parent !== window && window.parent.postMessage(msg, '*'); } catch (e) {}
    if (location.protocol === 'file:' || location.hostname === 'localhost') console.log('[bridge]', JSON.stringify(msg));
  }
};
const vibrate = (kind = 'light') => {
  Bridge.send('vibrate', { style: kind });
  if (!Bridge.native() && navigator.vibrate) { try { navigator.vibrate(kind === 'error' ? [40, 60, 40] : kind === 'success' ? [20, 40, 60] : 15); } catch (e) {} }
};

/* ================= Звук (выключен по умолчанию) ================= */
const Sound = {
  on: false, ctx: null, noise: null,
  toggle() {
    this.on = !this.on;
    if (this.on && !this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { this.ctx = new AC(); const len = this.ctx.sampleRate * .4 | 0; this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const d = this.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    document.querySelectorAll('.sound-btn').forEach(b => { b.classList.toggle('on', this.on); b.setAttribute('aria-pressed', this.on); });
    if (this.on) this.good();
  },
  tone(f, d, type = 'sine', v = .13, when = 0, f2) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .05);
  },
  spray() {
    if (!this.on || !this.ctx) return;
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain(), t = this.ctx.currentTime;
    s.buffer = this.noise; f.type = 'bandpass'; f.frequency.value = 3800; f.Q.value = .7;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + .32);
    s.connect(f); f.connect(g); g.connect(this.ctx.destination); s.start(t); s.stop(t + .4);
    this.tone(880, .12, 'triangle', .08, .05, 1320);
  },
  tap() { this.tone(600, .06, 'triangle', .07); },
  good() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, .18, 'triangle', .11, i * .07)); },
  bad() { this.tone(330, .18, 'sine', .12, 0, 260); this.tone(250, .3, 'sine', .1, .14, 200); },
  deliver() { this.tone(988, .1, 'sine', .07); this.tone(1318, .14, 'sine', .07, .07); },
  steal() { this.tone(700, .35, 'square', .04, 0, 200); },
  hit() { this.tone(160, .2, 'square', .08, 0, 80); this.spray(); },
  win() { [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => this.tone(f, .22, 'triangle', .11, i * .1)); }
};

/* ================= Утилиты ================= */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app'), fx = $('#fx');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
/* localStorage + память: если хранилище недоступно, всё работает в рамках одного захода */
const mem = {};
const store = {
  get(k) { if (k in mem) return mem[k]; try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
/* обучающие плашки показываются один раз — даже между заходами */
const SEEN = new Set(store.get('klx_seen') || []);
const seen = k => SEEN.has(k);
const markSeen = k => { SEEN.add(k); store.set('klx_seen', [...SEEN]); };
/* недавно показанные карточки уходят в конец очереди, чтобы контент не повторялся */
const Recent = {
  order(key, arr) { const r = new Set(store.get('klx_r_' + key) || []), s = shuffle(arr); return [...s.filter(x => !r.has(x.id)), ...s.filter(x => r.has(x.id))]; },
  mark(key, items, pool) { const ids = [...new Set([...items.map(x => x.id), ...(store.get('klx_r_' + key) || [])])].slice(0, Math.floor(pool.length * .7)); store.set('klx_r_' + key, ids); }
};
const withIds = (key, arr) => { arr.forEach((x, i) => { x.id = key + i; }); return arr; };
/* звёзды по уровням */
const PROG = {
  all() { return store.get('klx_prog') || {}; },
  get(id) { return this.all()[id] || 0; },
  set(id, n) { const p = this.all(); if ((p[id] || 0) < n) { p[id] = n; store.set('klx_prog', p); } },
  total() { return Object.values(this.all()).reduce((a, b) => a + b, 0); }
};
function seeded(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
/* гладкая замкнутая клякса: Catmull-Rom → кубические Безье (одинаковая структура → можно морфить) */
function blobPath(cx, cy, r, n, jit, seed, alt = 0) {
  const R = seeded(seed), p = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 - Math.PI / 2;
    const rr = r * (1 - jit + R() * jit * 2) * (alt && i % 2 ? 1 - alt : 1);
    p.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  const f = v => v.toFixed(1);
  let d = `M${f(p[0][0])} ${f(p[0][1])}`;
  for (let i = 0; i < n; i++) {
    const p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
    d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
  }
  return d + 'Z';
}

/* ================= SVG: иконки и дудлы ================= */
const ICON = {
  x: `<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>`,
  pause: `<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="2" fill="currentColor"/></svg>`,
  sound: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path class="wv" d="M15.5 9.2a4 4 0 0 1 0 5.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path class="wv wv2" d="M18 6.8a7.5 7.5 0 0 1 0 10.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>

};
/* маркерные дудлы: pathLength=1 → «рисуются» через .draw */
const DOODLE = {
  under: c => `<svg viewBox="0 0 200 24" preserveAspectRatio="none" class="draw"><path pathLength="1" d="M4 15C40 5 80 20 120 10s60 2 76 3" style="stroke:${c}" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#rough)"/></svg>`,
  scribble: c => `<svg viewBox="0 0 200 120" preserveAspectRatio="none" class="draw"><path pathLength="1" d="M30 70C10 30 90 8 150 18s50 50 10 76-150 18-140-20 90-50 150-30" style="stroke:${c}" stroke-width="7" fill="none" stroke-linecap="round" filter="url(#rough)"/></svg>`,
  starO: (c, x, y, s = 1, d = 0) => `<g transform="translate(${x} ${y}) scale(${s})" class="draw" style="--d:${d}s"><path pathLength="1" d="M0-14l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z" style="stroke:${c}" stroke-width="2.6" fill="none" stroke-linejoin="round"/></g>`,
  zig: (c, x, y, s = 1, d = 0) => `<g transform="translate(${x} ${y}) scale(${s})" class="draw" style="--d:${d}s"><path pathLength="1" d="M0 0l8-10 6 12 8-12 6 12 8-10" style="stroke:${c}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`,

};

/* splat-клякса из баллончика: шумовой фильтр + брызги + потёки */
function splatSVG(style = 'class="splat"') {
  const s = Math.random() * 1000 | 0, R = seeded(s);
  let dots = '';
  for (let i = 0; i < 16; i++) { const a = R() * Math.PI * 2, r = 42 + R() * 22; dots += `<circle cx="${(75 + Math.cos(a) * r).toFixed(1)}" cy="${(70 + Math.sin(a) * r * .8).toFixed(1)}" r="${(1 + R() * 3.4).toFixed(1)}"/>`; }
  let drips = '';
  for (let i = 0; i < 3; i++) { const x = 55 + R() * 40, l = 18 + R() * 30; drips += `<path class="drip" pathLength="1" d="M${x.toFixed(1)} 96v${l.toFixed(1)}" stroke-width="${(5 + R() * 4).toFixed(1)}" stroke-linecap="round" style="stroke:var(--m)"/>`; }
  return `<svg ${style} viewBox="0 0 150 150"><g class="sp" style="fill:var(--m)" filter="url(#spray)"><path d="${blobPath(75, 70, 36, 11, .28, s)}"/>${dots}</g>${drips}</svg>`;
}

function newGame() {
  stopAll();
  const used = new Set(), foxOrder = Recent.order('fox', FOXPOOL), honOrder = Recent.order('hon', HONPOOL);
  const waves = WAVES.map((w, wi) => {
    const known = WAVES.slice(0, wi + 1).flatMap(x => x.tricks);
    const foxes = [];
    w.tricks.forEach(k => { const f = foxOrder.find(x => x.k === k && !used.has(x)); if (f) { used.add(f); foxes.push(f); } });
    while (foxes.length < w.fox) {
      const f = foxOrder.find(x => known.includes(x.k) && !used.has(x)) || pick(FOXPOOL.filter(x => known.includes(x.k)));
      used.add(f); foxes.push(f);
    }
    const hon = honOrder.filter(x => !used.has(x)).slice(0, w.hon); hon.forEach(h => used.add(h));
    let q = shuffle([...foxes, ...hon]);
    if (wi === 0) { // обучение: первым идёт Лис с кодом, вторым — друг
      const f0 = q.find(x => x.fox && x.k === 'code'), h0 = q.find(x => !x.fox);
      q = [f0, h0, ...q.filter(x => x !== f0 && x !== h0)];
    }
    return q.map(item => ({ item, retry: false }));
  });
  const items = waves.flat().map(x => x.item);
  Recent.mark('fox', items.filter(x => x.fox), FOXPOOL); Recent.mark('hon', items.filter(x => !x.fox), HONPOOL);
  G = ACTIVE = {
    id: 'fox', waves, wi: 0, queue: [], resolved: 0, waveTotal: 1, live: [], paused: true, running: false, last: 0, sinceSpawn: 99, side: false, waveEnding: false,

}

/* ---------- игровой цикл ---------- */
function loop(t, id) {
  if (!G || !G.running || id !== loopId) return;
  const dt = Math.min(.05, (t - G.last) / 1000); G.last = t;
  if (!G.paused) update(dt);
  requestAnimationFrame(tt => loop(tt, id));
}
function update(dt) {
  const field = $('#field'); if (!field) return;
  const H = field.clientHeight, W = field.clientWidth, w = WAVES[G.wi];
  G.sinceSpawn += dt;
  const topY = G.live.filter(b => b.state === 'fall').reduce((m, b) => Math.min(m, b.y), Infinity);
  if (G.queue.length && G.sinceSpawn > w.gap && topY > 28) spawn(G.queue.shift(), field, W);
  for (const b of G.live) {
    if (b.state !== 'fall') continue;
    b.y += H / w.T * dt; place(b);
    if (b.y > H * .2 && !b.tipped) { // подсказки «в моменте»: новая уловка или первый друг
      // каждая плашка показывается один раз за всё время, а не в каждой игре
      if (b.entry.item.fox && !seen('trick:' + b.entry.item.k)) { b.tipped = true; markSeen('trick:' + b.entry.item.k); newTrickTip(b); return; }
      if (!b.entry.item.fox && !seen('honest')) { b.tipped = true; markSeen('honest'); honestTip(b); return; }
    }
    if (b.y + b.h * .5 > H) arrive(b);
  }
  G.live = G.live.filter(b => b.state !== 'dead');
  if (!G.queue.length && !G.live.length && !G.waveEnding) waveDone();
}
function spawn(entry, field, W) {
  const it = entry.item, el = document.createElement('div');
  el.className = 'msg'; el.setAttribute('role', 'button'); el.tabIndex = 0;
  el.innerHTML = `<div class="msg-in"><div class="msg-top"><div class="msg-av">${avatar(it.av)}</div><div class="msg-meta"><b>${it.name}</b><span class="${it.warn ? 'warn' : ''}">${it.sub}</span></div></div>
    <div class="msg-text">${it.p.length > 1 ? `${it.p[0]}<span class="key">${it.p[1]}</span>${it.p[2]}` : it.p[0]}</div></div>`;
  field.appendChild(el);
  const w = el.offsetWidth, h = el.offsetHeight, room = Math.max(0, W - w - 16);

const DREAMS = [{ e: '🛴', t: 'Самокат' }, { e: '🎨', t: 'Набор художника' }, { e: '🎧', t: 'Наушники' }, { e: '🏀', t: 'Баскетбольный мяч' }];
const DREAM = 120, ALLOW = 40, WEEKS = 5;
const pgGain = c => c.kind === 'earn' || c.kind === 'credit';
const pgCost = c => pgGain(c) ? 0 : c.n;

async function startPiggy() {
  stopAll();
  const take = {}, used = [];
  Object.keys(PIGGY).forEach(k => { take[k] = Recent.order('pg_' + k, PIGGY[k]); });
  const draw = k => { const c = take[k].shift() || pick(PIGGY[k]); used.push(c); return c; };
  const specials = shuffle(['deposit', 'credit', 'trap', 'earn', pick(['earn', 'trap', 'deposit'])]);
  const weeks = specials.map(sp => shuffle([draw('need'), draw('want'), draw('want'), draw(sp)]));
  Object.keys(PIGGY).forEach(k => Recent.mark('pg_' + k, used.filter(c => c.kind === k), PIGGY[k]));
  const S = ACTIVE = { id: 'piggy', paused: false, score: 0, wallet: 0, dep: [], debt: 0, needMiss: 0, traps: 0, credits: 0, wants: 0, wantSpent: 0, earned: 0, saved: 0, dream: null };
  shell('piggy', `<div class="hud-t" id="hudT">Неделя 1 из ${WEEKS}</div>${hudSegs(WEEKS)}`,
    `<div class="pg-top"><div class="pg-dream" id="dreamE">❔</div><div class="pg-info"><b id="dreamT">Мечта</b><div class="pbar"><i id="pgBar"></i></div><div class="pg-nums"><span id="pgHave">0 из ${DREAM}</span><span id="pgLeft"></span></div></div><div class="wallet" id="wallet">${ICON.coin}<b id="walletN">0</b></div></div>
    <div class="pg-chips" id="pgChips"></div>
    <div class="deck" id="deck"></div>
    <div class="choice"><button class="btn no" id="bNo">👈 Нет</button><button class="btn" id="bYes">Да 👉</button></div>`);
  await howTo(S); if (ACTIVE !== S) return;
  S.dream = await pickDream(); if (ACTIVE !== S) return;
  $('#dreamE').textContent = S.dream.e; $('#dreamT').textContent = `Мечта: ${S.dream.t}`; pgMoney(S, 0);
  for (let w = 0; w < WEEKS; w++) {
    $('#hudT').textContent = `Неделя ${w + 1} из ${WEEKS}`; setSegs(w);
    await overlay(`<div class="wk">${pigSVG()}</div><div class="big">Неделя ${w + 1}${DOODLE.under('var(--m)')}</div>
      <div class="hand">Карманные деньги: +${ALLOW} монет${S.debt ? `<br>Но сначала вернём долг: −${Math.min(S.debt, S.wallet + ALLOW)}` : ''}</div><button class="btn" id="go">Получить монетки</button>`);
    if (ACTIVE !== S) return;
    pgMoney(S, ALLOW); Sound.deliver();
    if (S.debt) { await wait(600); const pay = Math.min(S.debt, S.wallet); S.debt -= pay; pgMoney(S, -pay); pgChips(S); say(`Вернули долг: −${pay} монет 💳`); }
    else say(w === 0 ? 'Карманные пришли! На что потратить? 🤔' : pick(['Новая неделя — новые соблазны! 🤔', 'Монетки в кошельке. Думай, прежде чем тратить 🐷', 'Помни про мечту! ✨']));
    const q = weeks[w].slice(), n0 = q.length;
    let k = 0;
    while (q.length) {
      const c = q.shift();
      setSegs(w, k++ / (n0 + (q.some(x => x.retry) ? 1 : 0)));
      const yes = await pgCard(S, c, q[0]);
      if (ACTIVE !== S) return;
      await pgApply(S, c, yes, q);
      if (ACTIVE !== S) return;
    }
    setSegs(w + 1);
  }
  pgFinale(S);
}
function pickDream() {
  const el = $('#waveIn');
  el.innerHTML = `<div class="hand" style="margin:0 0 4px">Копим на мечту!</div><div class="big" style="font-size:46px">Выбери мечту${DOODLE.under('var(--m)')}</div>
    <div class="hand" style="font-size:22px">Она стоит ${DREAM} монет. Успеешь накопить за ${WEEKS} недель?</div>
    <div class="opts" style="width:100%;max-width:340px">${DREAMS.map((d, i) => `<button class="opt" data-d="${i}" style="--i:${i};background:#fff;box-shadow:var(--shadow)"><span class="oi" style="background:var(--soft)">${d.e}</span><span>${d.t}</span></button>`).join('')}</div>`;
  el.classList.add('show');
  return new Promise(r => el.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { Sound.tap(); vibrate(); el.classList.remove('show'); r(DREAMS[+b.dataset.d]); }));
}
function pgMoney(S, d) {
  S.wallet += d;
  const n = $('#walletN'); if (!n) return;
  n.textContent = S.wallet;
  $('#pgBar').style.width = clamp(S.wallet / DREAM * 100, 0, 100) + '%';

  $('#pgLeft').textContent = S.wallet >= DREAM ? 'хватает! 🎉' : `ещё ${DREAM - S.wallet}`;
  if (d) { const w = $('#wallet'); w.classList.remove('wob'); void w.offsetWidth; w.classList.add('wob'); floatAt(w, (d > 0 ? '+' : '') + d, 'pts'); }
}
function pgChips(S) {
  const dep = sum(S.dep, x => x), c = $('#pgChips'); if (!c) return;
  c.innerHTML = (dep ? `<span class="minichip">🏦 Во вкладе: вернётся ${dep}</span>` : '') + (S.debt ? `<span class="minichip" style="color:#C2184B">💳 Долг: ${S.debt}</span>` : '');
}
const pgInner = c => `<div class="ce">${c.e}</div><h3>${c.t}</h3><p>${c.s}</p><div class="price ${pgGain(c) ? 'plus' : ''}">${ICON.coin}${pgGain(c) ? '+' : '−'}${c.n}</div>`;
function pgCard(S, c, next) {
  const deck = $('#deck');
  deck.innerHTML = (next ? `<div class="card back">${pgInner(next)}</div>` : '') + `<div class="card" id="card">${pgInner(c)}<div class="stamp yes">Да</div><div class="stamp no">Нет</div></div>`;
  const el = $('#card'), sy = el.querySelector('.stamp.yes'), sn = el.querySelector('.stamp.no');
  return new Promise(res => {
    let x0 = null, y0 = 0, dx = 0, dy = 0, done = false;
    const setT = () => { el.style.transform = `translate(${dx}px,${dy * .3}px) rotate(${dx / 14}deg)`; sy.style.opacity = clamp(dx / 90, 0, 1); sn.style.opacity = clamp(-dx / 90, 0, 1); };
    const reset = () => { dx = dy = 0; el.style.transition = 'transform .3s var(--spring)'; setT(); };
    const decide = yes => {
      if (done || S.paused || isModal()) return reset();
      if (yes && pgCost(c) > S.wallet) {
        reset(); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
        Sound.bad(); vibrate('error'); mood('oops', 1600);
        say(`Не хватает монет: нужно ${pgCost(c)}, а у тебя ${S.wallet}. Придётся сказать «нет» 🙅`);
        return;
      }
      done = true; S.onKey = null; Sound.tap();
      el.style.transition = ''; el.classList.add('fly');
      el.style.transform = `translate(${yes ? innerWidth : -innerWidth}px,40px) rotate(${yes ? 30 : -30}deg)`; el.style.opacity = 0;
      setTimeout(() => res(yes), 260);
    };
    el.addEventListener('pointerdown', e => { if (done) return; x0 = e.clientX; y0 = e.clientY; el.setPointerCapture(e.pointerId); el.style.transition = 'none'; });
    el.addEventListener('pointermove', e => { if (x0 === null) return; dx = e.clientX - x0; dy = e.clientY - y0; setT(); });
    const end = () => { if (x0 === null) return; x0 = null; if (Math.abs(dx) > 80) decide(dx > 0); else reset(); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    $('#bYes').onclick = () => decide(true); $('#bNo').onclick = () => decide(false);
    S.onKey = e => { if (e.key === 'ArrowRight') decide(true); if (e.key === 'ArrowLeft') decide(false); };
  });
}
async function pgApply(S, c, yes, q) {
  const tag = `<span class="chip">${PG_KIND[c.kind]}</span> `, w = $('#wallet');
  if (c.kind === 'need') {
    if (yes) { pgMoney(S, -c.n); setScore(10, w); mood('happy'); say(tag + 'Сначала нужное — потом хотелки 👍'); }
    else if (!c.retry) {
      S.needMiss++; mood('oops', 2000);
      q.push({ ...c, retry: true, n: c.n + 5, t: c.t + ' — срочно!', s: 'Всё-таки понадобилось! Срочная покупка обходится дороже.' });
      if (!seen('pg:need')) { markSeen('pg:need'); await lesson('oops', 'Это была нужная вещь!', `${c.why} Нужные вещи покупают в первую очередь. Иначе потом придётся покупать срочно — и дороже.`); }
      say(tag + `${c.why} Она ещё вернётся — уже дороже 😕`);
    } else { mood('sad', 2000); say(tag + 'Без нужных вещей бывает трудно. В следующий раз оставь на них монетки!'); }
  } else if (c.kind === 'want') {
    if (yes) { pgMoney(S, -c.n); S.wants++; S.wantSpent += c.n; mood('happy'); say(tag + `Приятно! Но до мечты стало дальше на ${c.n} 🙂`); }
    else { S.saved += c.n; setScore(5, w); mood('happy'); say(tag + `Сэкономлено ${c.n} — мечта ближе! 🐷`); }
  } else if (c.kind === 'deposit') {
    if (yes) {
      pgMoney(S, -c.n); S.dep.push(c.ret); setScore(15, w); mood('happy', 1800);
      if (!seen('pg:deposit')) { markSeen('pg:deposit'); await lesson('happy', 'Ты открыл(а) вклад! 🏦', `Вклад — это когда деньги лежат в банке, а банк добавляет к ним немного сверху. Положил(а) ${c.n} — в конце получишь ${c.ret}. Такая прибавка называется «проценты».`); }
      say(tag + `Монетки растут: ${c.n} → ${c.ret} 🌱`);
    } else say(tag + `Можно и так. А вклад вернул бы ${c.ret} вместо ${c.n}.`);
  } else if (c.kind === 'credit') {
    if (yes) {
      pgMoney(S, c.n); S.debt += c.back; S.credits++; mood('oops', 2000);
      if (!seen('pg:credit')) { markSeen('pg:credit'); await lesson('oops', 'Это кредит — деньги в долг 💳', `Взял(а) ${c.n}, а вернуть придётся ${c.back}. Лишние ${c.back - c.n} — это переплата. Долг заберут из следующих карманных денег.`); }
      say(tag + `Вернуть придётся ${c.back}. Переплата ${c.back - c.n} 😬`);
    } else { setScore(10, w); mood('happy'); say(tag + `Верно! Взять ${c.n}, а отдать ${c.back} — невыгодно.`); }
  } else if (c.kind === 'trap') {
    if (yes) {
      pgMoney(S, -c.n); S.traps++; mood('sad', 2200); Sound.bad(); vibrate('error');
      if (!seen('pg:trap')) { markSeen('pg:trap'); await lesson('sad', 'Ой, это была ловушка!', `${c.why} Если обещают много денег за чуть-чуть — это почти всегда обман.`); }
      say(tag + c.why);
    } else { setScore(15, w); mood('happy'); say(tag + 'Ловко! Ты не попался на удочку 🦊'); }
  } else if (c.kind === 'earn') {
    if (yes) { pgMoney(S, c.n); S.earned += c.n; setScore(10, w); Sound.deliver(); mood('happy'); say(tag + `+${c.n} — честно заработано 💪`); }
    else say(tag + 'Можно и отдохнуть. Но монетки не помешали бы!');
  }
  pgChips(S);
  await wait(300);
}
async function pgFinale(S) {
  $('#deck').innerHTML = '';
  const dep = sum(S.dep, x => x);
  if (dep) { pgMoney(S, dep); S.dep = []; pgChips(S); Sound.deliver(); say(`Вклады вернулись с процентами: +${dep} 🏦`); await wait(1300); }
  if (S.debt) { const pay = Math.min(S.debt, S.wallet); pgMoney(S, -pay); S.debt -= pay; pgChips(S); say(`Вернули долг: −${pay} 💳`); await wait(1100); }

  modeResult({
    id: 'piggy', stars,
    title: ok ? (stars === 3 ? 'Финансовый гений!' : 'Мечта сбылась!') : 'Почти накопил(а)!',

      { icon: '<span style="font-size:26px">💪</span>', v: S.earned, l: 'монет заработано', c: 'var(--green)' },
      { icon: ICON.star, v: S.score, l: 'очков', c: 'var(--m)' }
    ],
    extra: rulesBlock('Что знают финансовые гении', [['✅', 'Сначала нужное, потом хотелки.'], ['🏦', 'Вклад: деньги лежат в банке и понемногу растут.'], ['💳', 'Кредит: вернуть придётся больше, чем взял.'], ['🦊', 'Обещают много и сразу — это ловушка.']]),
    payload: { score: S.score, saved: S.wallet, goal: DREAM, dreamReached: ok, wantsBought: S.wants, needsSkipped: S.needMiss, trapsFallen: S.traps, creditsTaken: S.credits, earned: S.earned },
    shareLine: ok ? `Накопил(а) на мечту ${S.dream.e} за 5 недель!` : `Накопил(а) ${S.wallet} из ${DREAM} монет 🐷`
  });
}

    };
    drawTop(); $('#tasks').innerHTML = '';
    await overlay(`${bigEmoji(sc.e)}<div class="big" style="font-size:40px">${sc.t}${DOODLE.under('var(--m)')}</div><div class="hand">${sc.goal}</div><button class="btn" id="go">Составить план</button>`);
    if (ACTIVE !== S) return;
    $('#tasks').innerHTML = tasks.map((t, i) => `<button class="task" data-t="${i}" style="--i:${i}"><span class="te">${t.e}</span><span><b>${t.t}</b><small>${t.m} мин</small></span></button>`).join('');
    say(S.i === 0 ? 'Нажимай на дела — они встанут в план. Что важнее всего?' : 'Новый план! Что тут самое важное? 🤔');
    $('#tasks').querySelectorAll('.task').forEach(b => b.onclick = () => {
      if (S.paused || S.busy) return;
      const t = tasks[+b.dataset.t], k = plan.indexOf(t);
      if (k >= 0) plan.splice(k, 1); else plan.push(t);
      b.classList.toggle('on', k < 0); Sound.tap(); vibrate('light');
      const u = used();
      if (u > sc.lim) { mood('oops'); say(`Не влезает! В плане ${u} мин, а есть только ${sc.lim} ⏰`); }
      else if (k < 0) say(`${t.e} +${t.m} мин. Свободно ещё ${sc.lim - u} мин`);
      else say(`Убрали. Свободно ${sc.lim - u} мин`);
      drawTop();
    });
    $('#goPlan').onclick = async () => {
      if (S.paused || S.busy) return;
      if (!plan.length) { mood('oops'); say('Сначала добавь дела в план 👆'); return; }
      S.busy = true; Sound.tap();
      const u = used(), over = u > sc.lim, miss = sc.tasks.filter(t => t.imp && !plan.includes(t)), fun = plan.filter(t => !t.imp);
      await timeSim(S, sc, plan);
      if (ACTIVE !== S) return;
      if (over) {
        tries++; S.tries++; Sound.bad(); vibrate('error'); mood('sad', 2000);
        await lesson('sad', `Не успели! ${sc.late}`, `План занял ${u} мин, а было только ${sc.lim}. ${fun.length ? `Может, это подождёт: ${fun.map(t => t.e + ' ' + t.t.toLowerCase()).join(', ')}?` : 'Подумай, что можно убрать.'}`, 'Исправить план');
      } else if (miss.length) {
        tries++; S.tries++; Sound.bad(); mood('oops', 2000);
        await modalP(`<div class="mh"><div class="mm" data-mood="oops">${klyaksik()}</div><h3>Успели… но кое-что забыли!</h3></div>
          <div class="mlist">${miss.map(t => `<div><b>${t.e} ${t.t}.</b> ${t.why}</div>`).join('')}</div>
          <p>Важные дела ставим в план первыми.</p><button class="btn" id="mOk">Исправить план</button>`);
      } else {
        if (!tries) S.perfect++;
        S.fun += fun.length;
        setScore((tries ? 20 : 40) + fun.length * 5, $('#goPlan')); Sound.win(); vibrate('success'); mood('happy', 2500);
        await modalP(`<div class="mh"><div class="mm" data-mood="happy">${klyaksik({ can: true })}</div><h3>Успели! ${sc.win}</h3></div>
          <p>${fun.length ? `И даже хватило времени на: ${fun.map(t => t.e + ' ' + t.t.toLowerCase()).join(', ')}. Отдыхать тоже важно — когда главное сделано 😊` : `Все важные дела сделаны.${sc.lim - u > 0 ? ` Осталось ${sc.lim - u} мин — можно было добавить что-то приятное!` : ''}`}</p>
          <button class="btn" id="mOk">${S.i + 1 < S.list.length ? 'Следующий план' : 'Смотреть итог'}</button>`);
        S.busy = false; setSegs(S.i + 1); res(); return;
      }
      S.busy = false; say('Поменяй план: нажми на дело, чтобы добавить или убрать его');
    };
  });
}
async function timeSim(S, sc, plan) {
  const el = $('#waveIn');
  el.innerHTML = `<div class="sim"><svg class="clock" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff" stroke="#111216" stroke-width="5"/>
    ${Array.from({ length: 12 }, (_, i) => { const a = i * Math.PI / 6; return `<circle cx="${(50 + Math.sin(a) * 35).toFixed(1)}" cy="${(50 - Math.cos(a) * 35).toFixed(1)}" r="2.4" fill="#111216"/>`; }).join('')}
    <line id="simHand" x1="50" y1="50" x2="50" y2="17" stroke="var(--red)" stroke-width="5" stroke-linecap="round" style="transform-origin:50px 50px;transition:transform .45s var(--out)"/><circle cx="50" cy="50" r="5" fill="#111216"/></svg>
    <div class="now" id="simNow">${sc.e} Поехали!</div><div class="mins" id="simMin">0 из ${sc.lim} мин</div></div>`;
  el.classList.add('show');
  await wait(RM ? 200 : 500);
  let acc = 0;
  for (const t of plan) {
    if (ACTIVE !== S) return;
    acc += t.m;
    $('#simNow').textContent = `${t.e} ${t.t}`;
    $('#simMin').textContent = `${acc} из ${sc.lim} мин`;
    $('#simHand').style.transform = `rotate(${acc / sc.lim * 360}deg)`;
    Sound.tone(520 + acc * 6, .08, 'triangle', .08);
    await wait(RM ? 200 : 620);
    if (acc > sc.lim) { $('#simNow').textContent = sc.late; await wait(1000); break; }
  }
  if (ACTIVE !== S) return;
  if (acc <= sc.lim) { $('#simNow').textContent = `${sc.e} Успели!`; await wait(700); }
  el.classList.remove('show');
}
function timeResult(S) {
  const stars = Math.max(1, S.perfect);
  modeResult({
    id: 'time', stars,
    title: ['', 'Учусь успевать!', 'Хозяин времени!', 'Повелитель времени!'][stars],
    sub: stars === 3 ? 'Все планы с первой попытки! Ты знаешь, что важно, и умеешь считать минуты.' : 'Все дела успели! Ещё немного практики — и планы будут получаться с первого раза.',
    stats: [
      { icon: '<span style="font-size:26px">✅</span>', v: S.list.length, l: 'планов выполнено', c: 'var(--green)' },
      { icon: '<span style="font-size:26px">🏆</span>', v: S.perfect, suf: '/' + S.list.length, l: 'с первой попытки', c: 'var(--yellow)' },
      { icon: '<span style="font-size:26px">😊</span>', v: S.fun, l: 'приятных дел успели', c: 'var(--pink)' },
      { icon: ICON.star, v: S.score, l: 'очков', c: 'var(--m)' }
    ],
    extra: rulesBlock('Секреты успевания', [['⭐', 'Сначала важные дела — потом приятные.'], ['⏱️', 'Знай, сколько минут занимает каждое дело.'], ['🧩', 'Осталось время? Добавь что-то для радости!']]),
    payload: { score: S.score, plans: S.list.length, firstTry: S.perfect, retries: S.tries, funAdded: S.fun },
    shareLine: `${S.perfect} из ${S.list.length} планов с первой попытки ⏰`
  });
}

/* ================= Глобальные обработчики ================= */
document.addEventListener('click', e => {
  if (e.target.closest('[data-sound]')) { Sound.toggle(); return; }
  if (e.target.closest('[data-close]')) { Bridge.send('close'); return; }
  if (e.target.closest('[data-pause]')) { Sound.tap(); pauseMenu(); return; }
  if (e.target.closest('[data-hub]')) { Sound.tap(); renderHub(); return; }
  if (e.target.closest('[data-help]')) { if (ACTIVE && !isModal()) { Sound.tap(); howTo(ACTIVE, true); } }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('ch')) { e.preventDefault(); bossTap(e.target); return; }
  if (ACTIVE && ACTIVE.onKey && !ACTIVE.paused && !isModal()) ACTIVE.onKey(e);
});

renderHub();
})();
</script>
</body>
